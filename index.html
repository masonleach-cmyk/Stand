/* ---------- tap outside the open palette closes it — but never for a
   two-finger gesture. A second finger touching down while we're still
   watching the first aborts the close-tracking entirely, so pinch-zooming
   never dismisses the color picker, no matter where the fingers land. ---------- */
let outsideTouch = null;
document.addEventListener('pointerdown', e => {
  if(!$('#palette').classList.contains('on')) return;
  if($('#palette').contains(e.target) || e.target.closest('#tColor')) return;
  if(outsideTouch){ outsideTouch = null; return; }   // a second finger joined mid-touch: a gesture, not a tap
  outsideTouch = { id:e.pointerId, x:e.clientX, y:e.clientY, t:Date.now() };
});
document.addEventListener('pointerup', e => {
  if(!outsideTouch || outsideTouch.id !== e.pointerId) return;
  const moved = Math.hypot(e.clientX-outsideTouch.x, e.clientY-outsideTouch.y) > 10;
  const quick = Date.now()-outsideTouch.t < 600;
  outsideTouch = null;
  if(!moved && quick) $('#palette').classList.remove('on');
});
document.addEventListener('pointercancel', () => { outsideTouch = null; });



/* ---------- open ---------- */
async function openDoc(id){
  const doc = S.docs.find(d => d.id === id); if(!doc) return;
  busy(true, 'Opening ' + doc.title);
  await yieldToPaint();
  try{
    const blob = await DB.get(K.pdf(id));
    if(!blob){ busy(false); toast("That file's data isn't in storage anymore. Remove it and add the PDF again.", 5000); return; }
    const vEl = $('#viewer');
    vEl.style.transition = ''; vEl.style.opacity = ''; vEl.style.transform = '';   // never inherit a stranded exit
    V.exiting = false; V.exitSeq++;                      // invalidate any pending teardown
    V.id = id; V.doc = doc; V.page = 1; V.zoom = 1; V.undo = []; V.dirty = false;
    V.cache.clear(); V.fit = 0;
    V.ink = (await DB.get(K.ink(id))) || {};
    for(const k in V.ink) for(const s of V.ink[k]) s.b = null;   // recompute bounds lazily
    V.pdf = await pdfjsLib.getDocument({data: new Uint8Array(await blob.arrayBuffer())}).promise;
    setMarkup(false);
    showBar(true);
    $('#viewer').classList.add('open');
    syncInkPanel();
    measure();
    setTimeout(measure, 320);   // again once the slide-in transition has settled
    await renderPage();
  }catch(err){
    console.error(err); toast('Could not open that file: ' + (err && err.message ? err.message : 'unknown error'), 5000);
  }
  busy(false);
}

$('#vBack').addEventListener('click', async () => {
  if(V.dirty) await saveInk();
  $('#viewer').classList.remove('open');
  setTimeout(()=>{ V.pdf = null; V.cache.clear(); }, 300);
  renderGrid();
});

/* ---------- page bitmap cache ---------- */
function trimCache(){
  if(V.cache.size <= 8) return;
  const keys = [...V.cache.keys()].sort((a,b) => Math.abs(a-V.page) - Math.abs(b-V.page));
  for(const k of keys.slice(8)) V.cache.delete(k);
}
let prefetchTimer = null;
function schedulePrefetch(){
  clearTimeout(prefetchTimer);
  prefetchTimer = setTimeout(prefetchNeighbors, 80);
}
async function prefetchNeighbors(){
  if(!V.pdf || V.zoom !== 1 || !V.fit) return;
  const want = [V.page+1, V.page-1, V.page+2, V.page+3]
    .filter(n => n>=1 && n<=V.pdf.numPages && !V.cache.has(n));
  for(const n of want){
    if(V.rendering || V.zoom !== 1 || V.cache.has(n)) break;
    try{
      const page = await V.pdf.getPage(n);
      const vp = page.getViewport({scale: V.fit});
      const w = Math.floor(vp.width), h = Math.floor(vp.height);
      const d = pageDpr(w,h);
      const c = document.createElement('canvas');
      c.width = Math.floor(w*d); c.height = Math.floor(h*d);
      const cx = c.getContext('2d', {alpha:false});
      cx.fillStyle = '#fff'; cx.fillRect(0,0,c.width,c.height);
      await page.render({ canvasContext: cx, viewport: page.getViewport({scale: V.fit*d}) }).promise;
      if(V.zoom === 1){ V.cache.set(n, {canvas:c, fit:V.fit, w, h}); trimCache(); }
    }catch(err){ /* a failed prefetch just means the live render does it later */ }
  }
}

/* Paint a cached page synchronously. No awaits: this is what makes taps instant. */
function applyEntry(e){
  V.renderW = e.w; V.renderH = e.h;
  pagewrap.style.width = e.w+'px'; pagewrap.style.height = e.h+'px';
  pdfCanvas.style.width = e.w+'px'; pdfCanvas.style.height = e.h+'px';
  if(pdfCanvas.width !== e.canvas.width || pdfCanvas.height !== e.canvas.height){
    pdfCanvas.width = e.canvas.width; pdfCanvas.height = e.canvas.height;
  }
  pctx.setTransform(1,0,0,1,0,0);
  pctx.drawImage(e.canvas, 0, 0);
}

async function renderPage(keepPan){
  if(!V.pdf) return;
  if(V.rendering){ V.want = V.page; return; }
  V.rendering = true;
  try{
    let guard = 0;
    do{
      V.want = null;
      const target = V.page;
      const page = await V.pdf.getPage(target);
      const base = page.getViewport({scale:1});
      const fit = Math.min(stageW/base.width, stageH/base.height);
      if(V.fit && Math.abs(V.fit - fit) > 0.0005) V.cache.clear();
      V.fit = fit;

      const cached = V.zoom === 1 ? V.cache.get(target) : null;
      if(cached && cached.fit === V.fit){
        applyEntry(cached);
      }else{
        const css = fit * V.zoom;
        const vp = page.getViewport({scale: css});
        const w = Math.floor(vp.width), h = Math.floor(vp.height);
        const d = pageDpr(w,h);
        V.renderW = w; V.renderH = h;
        pagewrap.style.width = w+'px'; pagewrap.style.height = h+'px';
        pdfCanvas.style.width = w+'px'; pdfCanvas.style.height = h+'px';
        const bw = Math.floor(w*d), bh = Math.floor(h*d);
        if(pdfCanvas.width !== bw || pdfCanvas.height !== bh){ pdfCanvas.width = bw; pdfCanvas.height = bh; }
        pctx.setTransform(1,0,0,1,0,0);
        pctx.fillStyle = '#fff'; pctx.fillRect(0,0,bw,bh);
        await page.render({ canvasContext: pctx, viewport: page.getViewport({scale: css*d}) }).promise;
        if(V.zoom === 1 && V.page === target){
          const snap = document.createElement('canvas');
          snap.width = bw; snap.height = bh;
          snap.getContext('2d',{alpha:false}).drawImage(pdfCanvas, 0, 0);
          V.cache.set(target, {canvas:snap, fit:V.fit, w, h});
          trimCache();
        }
      }
      if(keepPan) clampPan(); else centerPage();
      redrawInk();
    } while(V.want !== null && (V.page = V.want) && ++guard < 60);

    $('#pLabel').textContent = `${V.page} / ${V.pdf.numPages}`;
    schedulePrefetch();
  }catch(err){ console.error(err); }
  V.rendering = false;
}

/* ---------- ink ---------- */
function strokesHere(){ return V.ink[V.page] || (V.ink[V.page] = []); }

function bboxOf(s){
  if(s.b) return s.b;
  if(s.t === 'n'){
    // a stamp's glyph reaches up from its anchor point; pad generously since the
    // exact page aspect isn't known here and culling only needs a safe bound
    const p = s.p[0];
    // headroom above covers the longest stem the knob allows
    return (s.b = [p[0]-s.w*0.7, p[1]-s.w*2.2, p[0]+s.w*0.9, p[1]+s.w*0.8]);
  }
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;   // marks can land outside the page
  for(const p of s.p){
    if(p[0]<x0) x0=p[0]; if(p[0]>x1) x1=p[0];
    if(p[1]<y0) y0=p[1]; if(p[1]>y1) y1=p[1];
  }
  const pad = (s.w||0) + 0.005;
  return (s.b = [x0-pad, y0-pad, x1+pad, y1+pad]);
}

/* Page-space renderer, used for the ghost page and for flattened export. */
function drawStroke(ctx, s, W, H){
  const pts = s.p; if(!pts.length) return;
  if(s.t === 'n'){
    drawNoteGlyphAlpha(ctx, s, pts[0][0]*W, pts[0][1]*H, s.w*W);
    return;
  }
  ctx.save();
  if(s.a != null) ctx.globalAlpha = s.a;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle = s.c;
  ctx.lineWidth = Math.max(1, s.w * W);
  if(pts.length === 1){
    ctx.beginPath();
    ctx.arc(pts[0][0]*W, pts[0][1]*H, ctx.lineWidth/2, 0, Math.PI*2);
    ctx.fillStyle = s.c; ctx.fill(); ctx.restore(); return;
  }
  ctx.beginPath();
  ctx.moveTo(pts[0][0]*W, pts[0][1]*H);
  for(let i=1;i<pts.length-1;i++){
    ctx.quadraticCurveTo(pts[i][0]*W, pts[i][1]*H,
      (pts[i][0]+pts[i+1][0])/2*W, (pts[i][1]+pts[i+1][1])/2*H);
  }
  const last = pts[pts.length-1];
  ctx.lineTo(last[0]*W, last[1]*H);
  ctx.stroke(); ctx.restore();
}

function drawNoteGlyphAlpha(ctx, s, cx, cy, h){
  ctx.save();
  if(s.a != null) ctx.globalAlpha = s.a;
  drawNoteGlyph(ctx, s.k, cx, cy, h, s.c, s.sl);
  ctx.restore();
}

/* Screen-space renderer: page coords -> current pan/zoom -> device px. */
function paintStroke(ctx, s, ox, oy, S){
  const W=V.renderW, H=V.renderH, pts=s.p;
  if(!pts.length) return;
  if(s.t === 'n'){
    drawNoteGlyphAlpha(ctx, s, (pts[0][0]*W+ox)*S, (pts[0][1]*H+oy)*S, s.w*W*S);
    return;
  }
  ctx.save();
  if(s.a != null) ctx.globalAlpha = s.a;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle = s.c;
  ctx.lineWidth = Math.max(1, s.w * W * S);
  if(pts.length === 1){
    ctx.beginPath();
    ctx.arc((pts[0][0]*W+ox)*S, (pts[0][1]*H+oy)*S, ctx.lineWidth/2, 0, Math.PI*2);
    ctx.fillStyle = s.c; ctx.fill(); ctx.restore(); return;
  }
  ctx.beginPath();
  ctx.moveTo((pts[0][0]*W+ox)*S, (pts[0][1]*H+oy)*S);
  for(let i=1;i<pts.length-1;i++){
    ctx.quadraticCurveTo(
      (pts[i][0]*W+ox)*S, (pts[i][1]*H+oy)*S,
      ((pts[i][0]+pts[i+1][0])/2*W+ox)*S, ((pts[i][1]+pts[i+1][1])/2*H+oy)*S);
  }
  const last = pts[pts.length-1];
  ctx.lineTo((last[0]*W+ox)*S, (last[1]*H+oy)*S);
  ctx.stroke();
  ctx.restore();
}

// Full repaint: only on page change, zoom, pan-end, erase, undo. Culls offscreen marks.
function redrawInk(){
  inkAtX = panX; inkAtY = panY;
  inkLayer.style.transform = 'translate3d(0,0,0)';
  ictx.setTransform(1,0,0,1,0,0);
  ictx.clearRect(0,0,inkCanvas.width,inkCanvas.height);
  const list = V.ink[V.page];
  if(!list || !list.length) return 0;
  const vx0 = (-panX)/V.renderW, vx1 = (stageW-panX)/V.renderW;
  const vy0 = (-panY)/V.renderH, vy1 = (stageH-panY)/V.renderH;
  let drawn = 0;
  for(const s of list){
    const b = bboxOf(s);
    if(b[2] < vx0 || b[0] > vx1 || b[3] < vy0 || b[1] > vy1) continue;
    paintStroke(ictx, s, panX, panY, inkDpr);
    drawn++;
  }
  return drawn;
}

/* ---------- gestures ---------- */
const ptrs = new Map();
let stroke=null, pinch=null, swipe=null, panning=false, movedFar=false, liveAnchor=null;
let inkAtX=0, inkAtY=0;   // the pan the ink canvas was last rasterized at
let panRawX = null, panRawY = null;   // unresisted pan while a drag is live

function normPt(cx, cy){
  return [ (cx - stageL - panX)/V.renderW, (cy - stageT - panY)/V.renderH ];
}

stage.addEventListener('pointerdown', e => {
  if(!V.pdf || V.exiting) return;
  if(ptrs.size === 0){ syncStageOrigin(); stopViewAnim(); }   // fresh origin at the start of every gesture
  // hist is seeded at touch-down so even a gesture delivered in a single move
  // event still has a baseline to measure its speed against
  ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:Date.now(),
                         hist:[{y:e.clientY, t:nowMs()}]});
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}

  if(ptrs.size === 2){
    abortStroke(); cancelSwipe();
    const [a,b] = [...ptrs.values()];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const ids = [...ptrs.keys()];
    // Armed, not engaged. Two fingers touching down together is not yet a pinch
    // — if they lift without spreading, each was just a tap. Committing to a
    // pinch here swallowed quick alternating taps entirely.
    pinch = {
      ids, engaged:false,
      d0: Math.hypot(a.x-b.x, a.y-b.y) || 1,
      mx, my, cx:mx, cy:my,
      fx:(mx-stageL-panX)/(V.renderW||1), fy:(my-stageT-panY)/(V.renderH||1),
      zoom0:V.zoom, k:1
    };
    return;
  }
  if(ptrs.size > 2) return;

  movedFar = false; panning = false;
  // with the colour menu open the page is inert: the tap that dismisses it must
  // never also leave a mark
  if(V.markup && !$('#palette').classList.contains('on')) beginStroke(e);
  else {
    // At fit, anywhere. When zoomed, anywhere that is not on the page itself —
    // the letterbox around it has nothing to pan, so a swipe there is a gesture.
    const lx = e.clientX - stageL, ly = e.clientY - stageT;
    const onPage = lx >= panX && lx <= panX + V.renderW && ly >= panY && ly <= panY + V.renderH;
    if(V.zoom === 1 || !onPage)
      swipe = {x0:e.clientX, y0:e.clientY, dx:0, dir:0, t:Date.now(), ghost:false};
  }
}, {passive:false});

stage.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if(!p) return;
  const px = p.x, py = p.y;
  p.x = e.clientX; p.y = e.clientY;
  if(Math.abs(p.x-p.x0) > 8 || Math.abs(p.y-p.y0) > 8) movedFar = true;

  // Motion history per finger: the pan-or-flick decision at PAN_ARM reads it.
  p.hist.push({y:p.y, t:nowMs()});
  if(p.hist.length > 24) p.hist.shift();

  if(pinch){
    const a = ptrs.get(pinch.ids[0]), b = ptrs.get(pinch.ids[1]);
    if(a && b){
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      if(!pinch.engaged && Math.abs(dist - pinch.d0) > PINCH_ENGAGE){
        // the fingers really are spreading: become a pinch, and re-baseline from
        // this moment so the zoom doesn't jump by the slack we just allowed
        pinch.engaged = true;
        abortStroke(); cancelSwipe();
        const mx2 = (a.x+b.x)/2, my2 = (a.y+b.y)/2;
        pinch.mx = mx2; pinch.my = my2; pinch.cx = mx2; pinch.cy = my2;
        pinch.fx = (mx2-stageL-panX)/(V.renderW||1);
        pinch.fy = (my2-stageT-panY)/(V.renderH||1);
        // Absorb ONLY the engage slack, not the entire first event. A fast pinch
        // delivers most of its travel in one or two moves, and re-baselining to the
        // full distance threw that away, so quick gestures barely zoomed at all.
        pinch.d0 = dist - (dist > pinch.d0 ? PINCH_ENGAGE : -PINCH_ENGAGE);
        pinch.zoom0 = V.zoom; pinch.k = dist/pinch.d0;
      }
      if(pinch.engaged){
    e.preventDefault();
    // floor is low so a deliberate big zoom-out can shrink the page right down
    pinch.k = Math.max(0.05, Math.min(MAX_ZOOM/pinch.zoom0, dist/pinch.d0));
    pinch.cx = (a.x+b.x)/2; pinch.cy = (a.y+b.y)/2;
    // Everything is expressed with transform-origin 0 0, where a page-local point
    // L simply renders at T + k*L. Anchoring the point under the fingers is then
    // one subtraction, and the release animation can interpolate T and k directly
    // instead of unpicking a moving origin.
    const Lfx = pinch.fx*V.renderW, Lfy = pinch.fy*V.renderH;
    pinch.tx = (pinch.cx - stageL) - pinch.k*Lfx;
    pinch.ty = (pinch.cy - stageT) - pinch.k*Lfy;
    setViewTransform(pinch.k, pinch.tx, pinch.ty);
        return;
      }
    }
    // armed but not engaged: fall through so the primary finger can still draw,
    // swipe, or end as a tap
  }

  if(stroke){ e.preventDefault(); extendStroke(e); return; }
  if(V.markup) return;

  if(swipe){
    const dx = p.x - swipe.x0, dy = p.y - swipe.y0;
    if(!swipe.dir && !swipe.vert){
      // an upward flick anywhere on the page opens markup
      if(Math.abs(dy) > SWIPE_ARM && Math.abs(dy) > Math.abs(dx)){
        if(dy < 0){ swipe.vert = true; e.preventDefault(); }
        return;
      }
    }
    if(swipe.vert){ e.preventDefault(); return; }
    if(!swipe.dir){
      if(Math.abs(dx) < SWIPE_ARM || Math.abs(dx) <= Math.abs(dy)) return;
      swipe.dir = dx < 0 ? 1 : -1;
      const t = V.page + swipe.dir;
      swipe.canTurn = t >= 1 && t <= V.pdf.numPages;
      swipe.ghost = swipe.canTurn && prepGhost(swipe.dir);
    }
    e.preventDefault();
    // Full travel whenever a page exists to turn to; the ghost is just the preview.
    // Resistance only at the very first and last page.
    swipe.dx = swipe.canTurn ? dx : dx*0.3;
    moveSwipe(swipe.dx, swipe.dir, swipe.ghost);
    return;
  }

  if(!movedFar) return;

  /* Zoomed in with the finger on the page, so this drag is either a pan or an
     upward flick to open markup. Decide once, here, before a single pixel has
     moved: a quick flick is a gesture and the page stays put, a slow drag pans
     and can no longer be mistaken for a gesture however it ends. A fast
     DOWNWARD flick is judged the same way so it still doesn't pan, but there is
     nothing else for it to do. */
  if(!p.judged){
    const adx = Math.abs(p.x-p.x0), ady = Math.abs(p.y-p.y0);
    if(Math.max(adx, ady) < PAN_ARM) return;     // still inside the slop: undecided
    p.judged = true;
    const v = flickSpeed(p.hist);
    if(ady > adx && Math.abs(v) >= FLICK_V){
      p.consumed = true;                          // a gesture, never a tap
      e.preventDefault();
      if(v < 0 && !V.markup) setMarkup(true);      // flicked up: mark this up
      return;
    }
  }
  if(p.consumed) return;          // its gesture already fired; this finger won't pan

  panning = true; e.preventDefault();
  stopViewAnim();
  if(panRawX == null){ panRawX = panX; panRawY = panY; }
  panRawX += p.x - px; panRawY += p.y - py;
  const pb = viewBounds();
  panX = rubber(panRawX, pb.minX, pb.maxX);
  panY = rubber(panRawY, pb.minY, pb.maxY);
  place();
  inkLayer.style.transformOrigin = '0 0';
  inkLayer.style.transform = `translate3d(${panX-inkAtX}px,${panY-inkAtY}px,0)`;
}, {passive:false});

async function pointerFinished(e){
  const p = ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);

  if(pinch && !pinch.engaged && (!ptrs.has(pinch.ids[0]) || !ptrs.has(pinch.ids[1]))){
    // never became a real pinch — drop it and let this pointer be judged as a tap
    pinch = null;
  }
  if(pinch){
    // Commit as soon as EITHER pinch finger leaves. Waiting for both to lift left a
    // scaled transform on screen while the remaining finger panned, which visibly
    // threw the page across the screen.
    if(!ptrs.has(pinch.ids[0]) || !ptrs.has(pinch.ids[1])){
      const {k, fx, fy, cx, cy, zoom0} = pinch;
      const fromS = k;
      const fromX = pinch.tx != null ? pinch.tx : panX;
      const fromY = pinch.ty != null ? pinch.ty : panY;
      pinch = null;

      // Where the view should come to rest: the zoom clamped back into range,
      // and the page pulled back inside its edges. Pinching out bottoms out at
      // fit and springs back; the back button is what leaves the score.
      const targetZoom = Math.max(1, Math.min(MAX_ZOOM, zoom0*k));
      const s = targetZoom / zoom0;                       // scale vs the current raster
      const newW = V.renderW*s, newH = V.renderH*s;
      const b = viewBounds(newW, newH);
      const Lfx = fx*V.renderW, Lfy = fy*V.renderH;
      const toX = Math.min(b.maxX, Math.max(b.minX, (cx - stageL) - s*Lfx));
      const toY = Math.min(b.maxY, Math.max(b.minY, (cy - stageT) - s*Lfy));

      const settle = () => {
        // Resize the box and drop the scale in the SAME frame, so the page never
        // flashes at the wrong size: the old bitmap simply stretches to the new
        // box until the crisp re-render lands.
        V.renderW = Math.round(newW); V.renderH = Math.round(newH);
        pagewrap.style.width = V.renderW+'px'; pagewrap.style.height = V.renderH+'px';
        pdfCanvas.style.width = V.renderW+'px'; pdfCanvas.style.height = V.renderH+'px';
        V.zoom = targetZoom;
        panX = Math.round(toX); panY = Math.round(toY);
        place();
        redrawInk();
        renderPage(true);                                  // re-rasterize crisply
        if(V.markup) syncInkPanel();
      };

      const moves = Math.abs(s-fromS) > 0.002 ||
                    Math.abs(toX-fromX) > 0.5 || Math.abs(toY-fromY) > 0.5;
      if(moves) animateView(fromS, fromX, fromY, s, toX, toY, settle, 300);
      else settle();

      // Any finger still down starts clean, but must NOT be read as a tap when it
      // lifts, or every pinch would end by turning a page.
      for(const q of ptrs.values()){ q.x0 = q.x; q.y0 = q.y; q.consumed = true; }
      movedFar = false; panning = false;
    }
    return;
  }

  if(stroke){ endStroke(); return; }

  if(swipe && swipe.vert){
    const dy = p ? p.y - swipe.y0 : 0;
    swipe = null;
    if(dy < -EDIT_SWIPE && !V.markup) setMarkup(true);
    return;
  }
  if(swipe && swipe.dir){
    const dt = Math.max(1, Date.now()-swipe.t);
    const speed = Math.abs(swipe.dx)/dt;
    const go = swipe.canTurn && (Math.abs(swipe.dx) > stageW*0.16 || speed > 0.45);
    settleSwipe(go);
    return;
  }
  swipe = null;

  if(panning){
    panning = false;
    // Nothing is judged here any more. This drag was settled as a pan the moment
    // it left the slop, so however quickly the finger happens to be moving as it
    // lifts, it pans and only pans — no exit, no markup.
    // let the page travel back inside its edges rather than teleporting
    const pb = viewBounds();
    const tx = Math.min(pb.maxX, Math.max(pb.minX, panRawX == null ? panX : panRawX));
    const ty = Math.min(pb.maxY, Math.max(pb.minY, panRawY == null ? panY : panRawY));
    panRawX = panRawY = null;
    if(Math.abs(tx-panX) > 0.5 || Math.abs(ty-panY) > 0.5){
      animateView(1, panX, panY, 1, tx, ty, () => {
        panX = Math.round(tx); panY = Math.round(ty);
        place(); redrawInk();
      }, 260);
    }else{
      panX = Math.round(tx); panY = Math.round(ty);
      place(); redrawInk();
    }
    return;
  }
  if(!p) return;
  // Judge by how far the finger actually travelled, not by the panning flag's
  // tighter threshold, and allow a much longer hold.
  const travel = Math.hypot(p.x - p.x0, p.y - p.y0);
  if(!p.consumed && travel < TAP_SLOP && (Date.now()-p.t) < TAP_MS && !V.markup) handleTap(p.x - stageL);
}
stage.addEventListener('pointerup', pointerFinished);
stage.addEventListener('pointercancel', e => {
  const cp = ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  if(stroke) endStroke();
  // A swipe that carries on off the edge of the screen is cancelled rather than
  // released, so honour it here too instead of silently dropping the gesture.
  if(swipe && swipe.vert){
    const dy = cp ? cp.y - swipe.y0 : 0;
    swipe = null;
    if(dy < -EDIT_SWIPE && !V.markup) setMarkup(true);
  }
  else if(swipe && swipe.dir) settleSwipe(false); else swipe = null;
  if(pinch){ pinch=null; pagewrap.style.transform=''; inkLayer.style.transform='translate3d(0,0,0)'; clampPan(); redrawInk(); }
});

function handleTap(x){
  // narrower dead centre: the middle strip only toggles the chrome, and a tap
  // that lands there feels like a page turn that failed
  if(x < stageW*0.44) goPage(V.page-1);
  else if(x > stageW*0.56) goPage(V.page+1);
  else showBar($('#bar').classList.contains('hidden'));
}

/* ---------- swipe, book style: the next page rides in alongside ---------- */
function prepGhost(dir){
  const n = V.page + dir;
  if(!V.pdf || n < 1 || n > V.pdf.numPages) return false;
  const e = V.cache.get(n);
  if(!e || e.fit !== V.fit) { schedulePrefetch(); return false; }
  if(ghostCanvas.width !== e.canvas.width || ghostCanvas.height !== e.canvas.height){
    ghostCanvas.width = e.canvas.width; ghostCanvas.height = e.canvas.height;
  }
  ghostwrap.style.width = e.w+'px'; ghostwrap.style.height = e.h+'px';
  ghostCanvas.style.width = e.w+'px'; ghostCanvas.style.height = e.h+'px';
  gctx.setTransform(1,0,0,1,0,0);
  gctx.drawImage(e.canvas, 0, 0);
  for(const s of (V.ink[n] || [])) drawStroke(gctx, s, ghostCanvas.width, ghostCanvas.height);
  ghostwrap.style.visibility = 'visible';
  return true;
}
function moveSwipe(dx, dir, ghost){
  pagewrap.style.transform = `translate3d(${panX+dx}px,${panY}px,0)`;
  inkLayer.style.transform = `translate3d(${dx}px,0,0)`;
  if(ghost) ghostwrap.style.transform = `translate3d(${panX+dx+dir*stageW}px,${panY}px,0)`;
}
function settleSwipe(go){
  const s = swipe; swipe = null;
  if(!s){ return; }
  const dir = s.dir, end = go ? -dir*stageW : 0;
  const ease = 'transform .17s cubic-bezier(.22,.61,.36,1)';
  pagewrap.style.transition = ease;
  inkLayer.style.transition = ease;
  ghostwrap.style.transition = ease;
  moveSwipe(end, dir, s.ghost);
  setTimeout(() => {
    pagewrap.style.transition = ''; inkLayer.style.transition = ''; ghostwrap.style.transition = '';
    ghostwrap.style.visibility = 'hidden';
    if(go) goPage(V.page + dir);
    else { place(); inkLayer.style.transform = 'translate3d(0,0,0)'; }
  }, 180);
}
function cancelSwipe(){
  if(!swipe) return;
  swipe = null;
  ghostwrap.style.visibility = 'hidden';
  place(); inkLayer.style.transform = 'translate3d(0,0,0)';
}

/* ---------- paging: synchronous when the bitmap is ready ---------- */
function goPage(n, silent){
  if(!V.pdf) return false;
  n = Math.max(1, Math.min(V.pdf.numPages, n));
  if(n === V.page) return false;
  if(V.dirty) saveInk();
  V.page = n; V.zoom = 1;
  $('#pLabel').textContent = `${n} / ${V.pdf.numPages}`;
  const e = V.cache.get(n);
  if(e && e.fit === V.fit){
    applyEntry(e);
    centerPage();
    redrawInk();
    schedulePrefetch();
    return true;
  }
  renderPage();
  return false;
}

/* ---------- strokes: O(1) per pen event ---------- */
function clearLive(){
  lctx.setTransform(1,0,0,1,0,0);
  lctx.clearRect(0,0,liveCanvas.width,liveCanvas.height);
}
function beginStroke(e){
  if(V.erasing){ stroke = {erase:true}; eraseAt(normPt(e.clientX, e.clientY)); return; }
  const pt = normPt(e.clientX, e.clientY);
  const hl = V.tool === 'highlight';

  if(V.tool === 'note'){
    // stamps land on release, so a pinch that starts in markup mode can be
    // abandoned without leaving a stray note behind
    stroke = { note:true, id:uid(), t:'n', k:V.note, c:colorNow(), sl:V.stem,
               w:V.size*NOTE_MULT*V.zoom/V.renderW, p:[pt] };
    clearLive();
    drawNoteGlyphAlpha(lctx, stroke, (pt[0]*V.renderW+panX)*inkDpr, (pt[1]*V.renderH+panY)*inkDpr,
                       stroke.w*V.renderW*inkDpr);
    return;
  }

  // w is a FIXED fraction of the page, independent of the zoom you happen to be
  // drawing at (V.renderW/V.zoom is the page's zoom==1 width). So the nib looks
  // small zoomed out and big zoomed in, and a mark's size on the page never
  // changes no matter what zoom it's later viewed at.
  stroke = { id:uid(), t: hl ? 'h' : 'p', c:colorNow(),
             w:V.size*(hl?HL_MULT:1)*V.zoom/V.renderW, p:[pt] };
  if(hl) stroke.a = HL_ALPHA;
  clearLive();
  lctx.lineCap='round'; lctx.lineJoin='round';
  lctx.strokeStyle = stroke.c;
  lctx.lineWidth = Math.max(1, stroke.w * V.renderW * inkDpr);
  liveAnchor = pt;
}
function extendStroke(e){
  if(!stroke) return;
  if(stroke.erase){ eraseAt(normPt(e.clientX, e.clientY)); return; }
  const S = inkDpr, W = V.renderW, H = V.renderH;

  if(stroke.note){
    const pt = normPt(e.clientX, e.clientY);
    stroke.p[0] = pt;
    clearLive();
    drawNoteGlyphAlpha(lctx, stroke, (pt[0]*W+panX)*S, (pt[1]*H+panY)*S, stroke.w*W*S);
    return;
  }

  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for(const ev of evs){
    const pt = normPt(ev.clientX, ev.clientY);
    stroke.p.push(pt);
  }

  if(stroke.a != null){
    // A translucent stroke must be laid down as ONE path at one alpha, or every
    // segment join would double-composite and band the stroke. So the highlighter
    // repaints its own path each event (bounded by this stroke's own length,
    // never by how much is already on the page) while the opaque pen keeps the
    // O(1) incremental append. Overlapping a previous pass still deepens, which
    // is the behaviour you want from a highlighter.
    clearLive();
    lctx.save();
    lctx.globalAlpha = stroke.a;
    lctx.lineCap='round'; lctx.lineJoin='round';
    lctx.strokeStyle = stroke.c;
    lctx.lineWidth = Math.max(1, stroke.w * W * S);
    const pts = stroke.p;
    lctx.beginPath();
    lctx.moveTo((pts[0][0]*W+panX)*S, (pts[0][1]*H+panY)*S);
    for(let i=1;i<pts.length-1;i++){
      lctx.quadraticCurveTo((pts[i][0]*W+panX)*S, (pts[i][1]*H+panY)*S,
        ((pts[i][0]+pts[i+1][0])/2*W+panX)*S, ((pts[i][1]+pts[i+1][1])/2*H+panY)*S);
    }
    const last = pts[pts.length-1];
    lctx.lineTo((last[0]*W+panX)*S, (last[1]*H+panY)*S);
    lctx.stroke();
    lctx.restore();
    return;
  }

  // opaque pen: append only the new segment, one path per event
  lctx.beginPath();
  lctx.moveTo((liveAnchor[0]*W+panX)*S, (liveAnchor[1]*H+panY)*S);
  for(let i=stroke.p.length-evs.length;i<stroke.p.length;i++){
    const pt = stroke.p[i], prev = stroke.p[i-1] || pt;
    const mid = [(prev[0]+pt[0])/2, (prev[1]+pt[1])/2];
    lctx.quadraticCurveTo((prev[0]*W+panX)*S, (prev[1]*H+panY)*S, (mid[0]*W+panX)*S, (mid[1]*H+panY)*S);
    liveAnchor = mid;
  }
  lctx.stroke();
}
function endStroke(){
  if(!stroke) return;
  const s = stroke; stroke = null;
  clearLive();
  if(!s.erase && s.p.length){
    if(s.note && movedFar){ markDirty(); return; }   // dragged, not tapped: no stamp
    delete s.note;
    s.b = null; bboxOf(s);
    strokesHere().push(s);
    V.undo.push({type:'add', page:V.page, id:s.id});
    if(V.undo.length > 60) V.undo.shift();
    paintStroke(ictx, s, inkAtX, inkAtY, inkDpr);   // additive: no full repaint
  }
  markDirty();
}
function abortStroke(){
  if(!stroke) return;
  stroke = null;
  clearLive();
}
function eraseAt(pt){
  const list = strokesHere();
  const tol = Math.max(0.012, (V.size*2.6*V.zoom)/V.renderW);   // match the pen's page-fixed sizing
  let hit = false;
  for(let i=list.length-1;i>=0;i--){
    const s = list[i];
    const b = bboxOf(s);
    if(pt[0]<b[0]-tol||pt[0]>b[2]+tol||pt[1]<b[1]-tol||pt[1]>b[3]+tol) continue;
    const near = s.p.some((p,j) => {
      if(Math.hypot(p[0]-pt[0], p[1]-pt[1]) < tol + s.w/2) return true;
      if(j === 0) return false;
      return distToSeg(pt, s.p[j-1], p) < tol + s.w/2;
    });
    if(near){ V.undo.push({type:'remove', page:V.page, stroke:s, index:i}); list.splice(i,1); hit = true; }
  }
  if(hit) redrawInk();
}
function distToSeg(p,a,b){
  const dx=b[0]-a[0], dy=b[1]-a[1];
  const len = dx*dx+dy*dy;
  if(!len) return Math.hypot(p[0]-a[0],p[1]-a[1]);
  let t = ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/len;
  t = Math.max(0,Math.min(1,t));
  return Math.hypot(p[0]-(a[0]+t*dx), p[1]-(a[1]+t*dy));
}

/* ---------- modes ---------- */
function showBar(on){
  $('#bar').classList.toggle('hidden', !on);
  if(!on) $('#palette').classList.remove('on');
}
function setMarkup(on){
  V.markup = on;
  V.erasing = false;
  $('#tPen').classList.toggle('on', on);
  $('#tErase').classList.remove('on');
  $('#editFrame').classList.toggle('on', on);
  for(const id of ['#tColor','#tErase','#tUndo','#mPrev','#mNext','#tPen']) $(id).style.display = on ? 'grid' : 'none';
  $('#palette').classList.remove('on');
  if(on){ showBar(true); ensurePresetsLoaded(); refreshPreviewSize(); syncInkPanel(); }
  else if(V.dirty) saveInk();
}
$('#tPen').addEventListener('click', () => setMarkup(!V.markup));
$('#tColor').addEventListener('click', () => {
  if(V.erasing){ V.erasing = false; $('#tErase').classList.remove('on'); }
  const open = $('#palette').classList.toggle('on');
  if(open){ refreshPreviewSize(); syncInkPanel(); }
});
$('#tErase').addEventListener('click', () => {
  V.erasing = !V.erasing;
  $('#tErase').classList.toggle('on', V.erasing);
  if(V.erasing) $('#palette').classList.remove('on');
});
$('#mPrev').addEventListener('click', () => goPage(V.page-1));
$('#mNext').addEventListener('click', () => goPage(V.page+1));

$('#tUndo').addEventListener('click', () => {
  const u = V.undo.pop();
  if(!u){ toast('Nothing to undo'); return; }
  if(u.page !== V.page){ goPage(u.page); setTimeout(()=>applyUndo(u), 0); return; }
  applyUndo(u);
});
function applyUndo(u){
  const list = V.ink[u.page] || (V.ink[u.page] = []);
  if(u.type === 'add'){ const i = list.findIndex(s => s.id === u.id); if(i>-1) list.splice(i,1); }
  else { list.splice(Math.min(u.index, list.length), 0, u.stroke); }
  redrawInk(); markDirty();
}

/* ---------- saving ---------- */
let saveTimer;
function markDirty(){
  V.dirty = true;
  $('#unsaved').classList.add('on');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveInk, 1200);
}
async function saveInk(){
  if(!V.id || V.saving) return;
  clearTimeout(saveTimer);
  V.saving = true;
  const clean = {};
  for(const k in V.ink) if(V.ink[k] && V.ink[k].length)
    // keep the fields that define WHAT the mark is, not just where it is:
    // t (tool), a (alpha) and k (note kind) must survive a reload or highlighters
    // come back as opaque pen strokes and stamps lose their glyph
    clean[k] = V.ink[k].map(s => {
      const o = {id:s.id, c:s.c, w:s.w, p:s.p};
      if(s.t != null) o.t = s.t;
      if(s.a != null) o.a = s.a;
      if(s.k != null) o.k = s.k;
      if(s.sl != null) o.sl = s.sl;
      return o;
    });
  try{
    await DB.set(K.ink(V.id), clean);
    const hasMarks = Object.keys(clean).length > 0;
    if(V.doc.marked !== hasMarks){ V.doc.marked = hasMarks; saveIndexSoon(); }
    V.dirty = false;
    $('#unsaved').classList.remove('on');
  }catch(err){
    console.error(err);
    toast('Could not save markings: ' + err.message, 4000);
  }
  V.saving = false;
}

/* ---------- export a flattened copy ---------- */
async function exportDoc(id){
  const doc = S.docs.find(d => d.id === id); if(!doc) return;
  if(V.id === id && V.dirty) await saveInk();
  busy(true, 'Building a copy with your markings');
  try{
    const blob = await DB.get(K.pdf(id));
    if(!blob) throw new Error('the original file data is missing');
    const ink = (V.id === id ? V.ink : (await DB.get(K.ink(id)))) || {};
    const src = await PDFLib.PDFDocument.load(await blob.arrayBuffer());
    const pages = src.getPages();
    for(let i=0;i<pages.length;i++){
      const list = ink[i+1];
      if(!list || !list.length) continue;
      const p = pages[i];
      const {width, height} = p.getSize();
      const sc = Math.min(2, 1400/width);
      const c = document.createElement('canvas');
      c.width = Math.round(width*sc); c.height = Math.round(height*sc);
      const cx = c.getContext('2d');
      for(const s of list) drawStroke(cx, s, c.width, c.height);
      const png = await (await canvasBlob(c, 'image/png')).arrayBuffer();
      const img = await src.embedPng(png);
      p.drawImage(img, {x:0, y:0, width, height});
    }
    const bytes = await src.save();
    const name = (doc.title || 'score').replace(/[^\w\s-]/g,'').trim() + ' (marked).pdf';
    const file = new File([bytes], name, {type:'application/pdf'});
    busy(false);
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:name});
    }else{
      const url = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast('Copy ready');
    }
  }catch(err){
    busy(false); console.error(err);
    if(err && err.name !== 'AbortError') toast('Could not build the copy: ' + err.message, 4000);
  }
}

/* ---------- misc ---------- */
let rt;
window.addEventListener('resize', () => {
  if(!$('#viewer').classList.contains('open')) return;
  clearTimeout(rt); rt = setTimeout(() => { measure(); renderPage(); }, 180);
});
window.addEventListener('orientationchange', () => setTimeout(() => { measure(); renderPage(); }, 320));
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('beforeunload', () => { if(V.dirty) saveInk(); });
document.addEventListener('visibilitychange', () => { if(document.hidden && V.dirty) saveInk(); });

window.addEventListener('error', e => {
  console.error(e.error || e.message);
});
window.addEventListener('unhandledrejection', e => {
  console.error(e.reason);
  toast('Something went wrong: ' + (e.reason && e.reason.message ? e.reason.message : 'unknown error'), 3600);
});

async function boot(){
  if(window.__loadFail || typeof pdfjsLib === 'undefined' || typeof PDFLib === 'undefined'){
    showStartupError(
      (window.__loadFail || 'A required component') +
      " didn't load. If this is the first time you've opened Stand, you need a " +
      "connection once so it can cache its libraries. After that it works offline."
    );
    return;
  }
  try{
    await setupPdfEngine();
    syncInkPanel();
    await loadLibrary();
  }catch(err){
    console.error(err);
    showStartupError('Something unexpected happened while starting up: ' + err.message);
  }
}
// Ask the browser not to evict the library under storage pressure. Installed
// home-screen web apps are normally granted this.
async function requestDurableStorage(){
  try{
    if(navigator.storage && navigator.storage.persist){
      if(!(await navigator.storage.persisted())) await navigator.storage.persist();
    }
  }catch(e){}
}

// The service worker caches the app and its libraries so it opens offline.
function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('Offline caching unavailable:', err));
}

boot();
requestDurableStorage();
registerServiceWorker();
</script>
