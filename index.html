<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stand">
<meta name="theme-color" content="#1B2029">
<title>Stand</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" onerror="window.__loadFail='the PDF engine'"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" onerror="window.__loadFail=(window.__loadFail?window.__loadFail+' and the PDF parser':'the PDF parser')"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" onerror="window.__loadFail=(window.__loadFail?window.__loadFail+' and the PDF editor':'the PDF editor')"></script>
<style>
:root{
  --slate:#1B2029;
  --slate-2:#232935;
  --slate-3:#2E3542;
  --line:#3A4251;
  --paper:#FBFAF6;
  --ink:#11151C;
  --text:#E8EAEE;
  --text-dim:#9AA3B2;
  --text-faint:#6C7688;
  --pencil:#4A6FA5;
  --pencil-hi:#6E93C9;
  --red:#B2413A;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:#000;color:var(--text);font-family:var(--sans);
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:2px solid var(--pencil-hi);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
#viewer{transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);z-index:20;background:#000}
#viewer.open{transform:translateY(0)}

/* ---------- library header ---------- */
.lib-head{padding:calc(var(--safe-t) + 18px) 20px 0;flex:none}
.wordmark{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.wordmark h1{
  font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:.01em;
  margin:0;line-height:1;
}
.count{font-size:13px;color:var(--text-faint);white-space:nowrap}
.staff{margin:14px 0 0;height:9px;flex:none}
.staff span{display:block;height:1px;background:var(--line);margin-bottom:1px;opacity:.85}
.staff span:nth-child(odd){opacity:.55}

.searchrow{display:flex;gap:10px;padding:14px 20px 0;flex:none}
.search{
  flex:1;display:flex;align-items:center;gap:9px;background:var(--slate-2);
  border:1px solid var(--line);border-radius:11px;padding:0 12px;height:42px;
}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);min-width:0}
.search input::placeholder{color:var(--text-faint)}
.iconbtn{
  width:42px;height:42px;flex:none;display:grid;place-items:center;
  background:var(--slate-2);border:1px solid var(--line);border-radius:11px;
}
.iconbtn.primary{background:var(--pencil);border-color:var(--pencil)}
.iconbtn:active{transform:scale(.94)}

/* ---------- sets row ---------- */
.sets{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 4px;flex:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sets::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;
  border:1px solid var(--line);border-radius:18px;background:var(--slate-2);
  font-size:14px;color:var(--text-dim);white-space:nowrap;transition:background .14s,border-color .14s;
}
.chip.on{background:var(--pencil);border-color:var(--pencil);color:#fff}
.chip.drop{border-color:var(--pencil-hi);background:var(--slate-3);box-shadow:0 0 0 2px rgba(110,147,201,.35)}
.chip .n{font-size:12px;color:inherit;opacity:.62}
.chip.add{color:var(--text-faint);border-style:dashed}

/* ---------- grid ---------- */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 20px calc(var(--safe-b) + 40px)}
/* minmax(0,1fr), not 1fr: a bare 1fr is minmax(auto,1fr) and will not let a
   column shrink below its content's minimum width. The composer line is
   white-space:nowrap and a filename like IMSLP969260-PMLP5514-… has no break
   opportunity, so either one silently widens its own column — and because the
   page image is sized by aspect-ratio off that width, a wider column also makes
   a taller page. That is why two scores side by side came out different sizes. */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:820px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.tile{position:relative;min-width:0;touch-action:manipulation;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tile img,.ghost img{-webkit-user-drag:none;user-drag:none}
.tile .sheet{
  position:relative;width:100%;aspect-ratio:3/4;background:var(--paper);
  border-radius:3px 7px 7px 3px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.5),0 8px 18px -8px rgba(0,0,0,.65);
}
.tile .sheet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(90deg,rgba(0,0,0,.16),rgba(0,0,0,0));z-index:2}
.tile .sheet img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.tile .sheet .nothumb{width:100%;height:100%;display:grid;place-items:center;color:#B9B3A6;font-family:var(--serif);font-size:13px;padding:10px;text-align:center}
.tile .meta{padding:9px 2px 0;min-width:0}
/* Two lines are always reserved, so a one-line title doesn't pull the next row
   up and leave the grid ragged. overflow-wrap lets an unbroken filename split
   rather than push the column wider. */
.tile .t{font-family:var(--serif);font-size:15px;line-height:1.25;color:var(--text);
  overflow-wrap:anywhere;min-height:2.5em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .c{font-size:12.5px;color:var(--text-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .marks{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--pencil);box-shadow:0 0 0 2px rgba(251,250,246,.85);display:none;z-index:3}
.tile.marked .marks{display:block}
.tile .more{
  position:absolute;top:0;right:0;width:40px;height:40px;display:grid;place-items:center;z-index:4;
}
.tile .more i{
  display:block;width:26px;height:26px;border-radius:50%;background:rgba(17,21,28,.52);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:#fff;font-style:normal;font-size:15px;line-height:26px;text-align:center;letter-spacing:1px;
}
.tile.dragging{opacity:.25}
.ghost{position:fixed;z-index:999;pointer-events:none;width:126px;transform-origin:center;
  transform:scale(1.06) rotate(-1.6deg);filter:drop-shadow(0 14px 26px rgba(0,0,0,.6))}
.ghost .sheet{border-radius:3px 7px 7px 3px;overflow:hidden;background:var(--paper);aspect-ratio:3/4}
.ghost img{width:100%;height:100%;object-fit:cover;object-position:top center}

.empty{padding:64px 8px;text-align:center;color:var(--text-faint)}
.empty h2{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--text-dim);margin:0 0 6px}
.empty p{margin:0;font-size:14px}
.empty button{margin-top:18px;height:44px;padding:0 20px;border-radius:11px;background:var(--pencil);color:#fff}

/* ---------- sheet modal ---------- */
.backdrop{position:fixed;inset:0;background:rgba(8,10,14,.6);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheetmodal{
  position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--slate-2);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:8px 20px calc(var(--safe-b) + 20px);
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.sheetmodal.on{transform:translateY(0)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheetmodal h3{font-family:var(--serif);font-weight:600;font-size:19px;margin:0 0 14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--text-faint);margin-bottom:5px}
.field input,.field textarea,.field select{
  width:100%;background:var(--slate);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;outline:none;color:var(--text);
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--pencil)}
.field textarea{resize:vertical;min-height:76px;line-height:1.5}
.row2{display:flex;gap:11px}
.row2>*{flex:1;min-width:0}
.btnrow{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;height:48px;border-radius:12px;display:grid;place-items:center;font-size:15px;
  background:var(--slate-3);border:1px solid var(--line)}
.btn.go{background:var(--pencil);border-color:var(--pencil);color:#fff;font-weight:500}
.btn.danger{color:var(--red);flex:none;width:52px}
.btn:active{transform:scale(.985)}

/* ---------- viewer: bounded, GPU-composited layers ---------- */
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#000;contain:strict}
.pagewrap,.ghostwrap{
  position:absolute;left:0;top:0;background:var(--paper);
  will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden;
}
.ghostwrap{visibility:hidden}
.pagewrap canvas,.ghostwrap canvas{display:block;width:100%;height:100%}
/* ink layers are viewport-sized, never page-sized, so cost never grows with zoom */
.inklayer{position:absolute;inset:0;pointer-events:none;will-change:transform;transform:translate3d(0,0,0)}
.inklayer canvas{position:absolute;left:0;top:0}

/* one borderless row, floating clear of the page */
/* The bar is only its buttons as far as touch is concerned. As a solid strip it
   swallowed swipes that began near the bottom of the screen — which is exactly
   where an upward swipe naturally starts. */
.bar{
  position:absolute;left:0;right:0;bottom:0;z-index:14;
  display:flex;align-items:center;gap:2px;
  padding:8px 10px calc(var(--safe-b) + 8px);
  transition:opacity .18s ease,transform .18s ease;
  pointer-events:none;
}
.bar button{pointer-events:auto}
.bar.hidden{opacity:0;transform:translateY(10px);pointer-events:none}
.bar button{
  height:44px;min-width:44px;padding:0 10px;border-radius:10px;
  display:grid;place-items:center;color:rgba(255,255,255,.82);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.85)) drop-shadow(0 0 5px rgba(0,0,0,.5));
}
.bar button:active{color:#fff;transform:scale(.92)}
.bar button.on{color:var(--pencil-hi)}
.bar .spacer{flex:1}
.bar .page{
  font-size:13px;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;
  padding:0 6px;white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.85), 0 0 5px rgba(0,0,0,.5);
}
.bar .dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.bar .unsaved{
  width:6px;height:6px;border-radius:50%;background:var(--pencil-hi);
  margin-left:-4px;align-self:flex-start;margin-top:12px;display:none;
}
.bar .unsaved.on{display:block}

/* markup-mode indicator: light spilling in from the four edges. Built from
   gradients rather than inset box-shadows so the falloff is a true fade to
   transparent instead of a blurred ring, and — because the gradient is on the
   base rule with only opacity toggled — it fades OUT as smoothly as it fades in.
   (With the shadow on the .on rule it vanished instantly on removal.) */
.editframe{
  position:absolute;inset:0;z-index:12;pointer-events:none;
  opacity:0;transition:opacity .34s cubic-bezier(.4,0,.2,1);
  background:
    linear-gradient(to right,  rgba(152,206,255,.52), rgba(82,164,250,.19) 45%, rgba(45,125,235,0) 100%) left   /38px 100% no-repeat,
    linear-gradient(to left,   rgba(152,206,255,.52), rgba(82,164,250,.19) 45%, rgba(45,125,235,0) 100%) right  /38px 100% no-repeat,
    linear-gradient(to bottom, rgba(152,206,255,.52), rgba(82,164,250,.19) 45%, rgba(45,125,235,0) 100%) top    /100% 38px no-repeat,
    linear-gradient(to top,    rgba(152,206,255,.52), rgba(82,164,250,.19) 45%, rgba(45,125,235,0) 100%) bottom /100% 38px no-repeat;
}
.editframe.on{ opacity:1 }

/* palette rises above the bar only in markup mode — a full color-picker now,
   sized for real use rather than a quick strip of swatches */
.palette{
  position:absolute;left:8px;right:8px;bottom:calc(var(--safe-b) + 62px);z-index:15;
  background:rgba(22,26,33,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:20px;padding:20px 18px 16px;
  max-height:min(74vh, 620px);overflow-y:auto;
  opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .18s,transform .18s;
}
.palette.on{opacity:1;transform:translateY(0);pointer-events:auto}

/* pen preview: an actual stroke rendered at the width it will really draw at
   the current zoom (on-screen CSS px == size * zoom) */
/* preview sits above the knobs normally; in note mode it moves to their right
   as a tall box, which suits a vertical glyph far better than a wide strip */
.workArea{display:flex;flex-direction:column;gap:12px}
.palette.noteMode .workArea{flex-direction:row-reverse;align-items:center;justify-content:center;gap:14px}
.penPreview{
  border-radius:11px;background:#FBFAF6;overflow:hidden;
  box-shadow:inset 0 1px 4px rgba(0,0,0,.26);
}
.penPreview canvas{display:block;width:100%}
/* Size and Stem sit side by side in note mode; only those two are visible, so
   the two-column grid puts them next to each other. Both shrink to leave room
   for the preview box alongside. */
.palette.noteMode .knobGrid{grid-template-columns:1fr 1fr;gap:10px 10px}
.palette.noteMode .knob{width:96px;height:96px}
.palette.noteMode .knobDot{width:5px;height:12px;top:26%}
.palette.noteMode .knobName{font-size:10px}
/* stem length only means anything for stamps */
.knobWrap.stem{display:none}
.palette.noteMode .knobWrap.stem{display:flex}
/* colour is forced black for stamps, so the swatches would be misleading here */
.palette.noteMode .presetrow{display:none}

/* tool picker: pen / highlighter / note */
.seg{display:flex;gap:3px;background:rgba(255,255,255,.07);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{
  flex:1;height:38px;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--text-faint);letter-spacing:.01em;
}
.seg button.on{background:rgba(255,255,255,.15);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.35)}

/* note stamp picker — only shown when the Note tool is active */
.noteSel{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.palette.noteMode .noteSel{display:grid}
.palette.noteMode .knobWrap.color{display:none}
.noteSel button{
  height:62px;border-radius:12px;background:rgba(255,255,255,.06);
  display:grid;place-items:center;
}
.noteSel button canvas{display:block;width:30px;height:42px}
.noteSel button.on{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28)}

/* four identical amp-style dials — hue, saturation, lightness, size — each
   with hard stops at MIN/MAX and a dead zone across the bottom so sliding
   through it holds the value instead of snapping to the far end. The filled
   arc is always the live pen color, so all four read as one family. */
/* Pen and highlighter show all four dials in a single row, so the whole colour
   control sits in one glance instead of a block. They shrink to fit four across. */
.knobGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 8px;justify-items:center;margin-bottom:2px}
.knobWrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.knobName{font-size:9px;letter-spacing:.04em;color:var(--text-faint);font-weight:600;text-transform:uppercase}

.knob{position:relative;width:76px;height:76px;border-radius:50%;flex:none;touch-action:none}
.knobTrack{position:absolute;inset:0;border-radius:50%}
.knobFace{
  position:absolute;inset:21%;border-radius:50%;
  background:linear-gradient(180deg,#2C333D,#1A1F27);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 3px 10px rgba(0,0,0,.5);
}
.knobArm{position:absolute;inset:0;pointer-events:none}
.knobDot{
  position:absolute;left:50%;top:27%;width:5px;height:11px;border-radius:3px;
  transform:translate(-50%,-50%);background:#fff;box-shadow:0 0 6px rgba(255,255,255,.55);
}

.presetrow{display:flex;align-items:center;gap:10px;margin-top:18px}
.swatches{display:flex;gap:8px;flex:1}
.swatches button{width:44px;height:44px;border-radius:12px;flex:none}
.swatches button.on{box-shadow:0 0 0 2px rgba(22,26,33,1),0 0 0 4px #fff}
#presetSave{
  height:40px;padding:0 16px;border-radius:11px;background:rgba(255,255,255,.1);
  color:var(--text);font-size:13.5px;font-weight:600;flex:none;
}
#presetSave:active{background:rgba(255,255,255,.18)}


.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 22px);transform:translate(-50%,14px);
  background:var(--slate-3);border:1px solid var(--line);color:var(--text);
  padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;max-width:86vw;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.busy{position:fixed;inset:0;z-index:70;background:rgba(14,17,22,.74);display:none;
  place-items:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.busy.on{display:grid}
.busy div{text-align:center}
.spin{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);
  border-top-color:var(--pencil-hi);margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.busy p{margin:0;font-size:14px;color:var(--text-dim)}
svg{display:block}
</style>
</head>
<body>
<div id="startupError" style="display:none;position:fixed;inset:0;z-index:200;background:#1B2029;color:#E8EAEE;font-family:-apple-system,sans-serif;padding:max(24px,env(safe-area-inset-top)) 22px 22px;text-align:center">
  <div style="max-width:340px;margin:80px auto 0">
    <div style="font-family:ui-serif,Georgia,serif;font-size:20px;margin-bottom:10px">Stand couldn't start</div>
    <p id="startupErrorMsg" style="font-size:14.5px;color:#9AA3B2;line-height:1.5;margin:0 0 18px"></p>
    <button onclick="location.reload()" style="height:46px;padding:0 22px;border-radius:11px;background:#4A6FA5;color:#fff;border:none;font-size:15px">Try again</button>
  </div>
</div>

<!-- ===================== LIBRARY ===================== -->
<div class="screen" id="library">
  <div class="lib-head">
    <div class="wordmark">
      <h1>Stand</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="staff"><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="searchrow">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6C7688" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="Find a piece" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <button class="iconbtn primary" id="addBtn" aria-label="Add sheet music">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div class="sets" id="sets"></div>

  <div class="scroll" id="libScroll">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      <h2>Nothing on the stand yet</h2>
      <p>Add a PDF and it will appear here.</p>
      <button id="emptyAdd">Add sheet music</button>
    </div>
  </div>
</div>

<!-- ===================== VIEWER ===================== -->
<div class="screen" id="viewer">
  <div class="stage" id="stage">
    <div class="ghostwrap" id="ghostwrap"><canvas id="ghostCanvas"></canvas></div>
    <div class="pagewrap" id="pagewrap"><canvas id="pdfCanvas"></canvas></div>
    <div class="inklayer" id="inkLayer">
      <canvas id="inkCanvas"></canvas>
      <canvas id="liveCanvas"></canvas>
    </div>
  </div>
  <div class="editframe" id="editFrame"></div>

  <div class="palette" id="palette">
    <div class="seg" id="toolSeg">
      <button data-tool="pen" class="on">Pen</button>
      <button data-tool="highlight">Highlighter</button>
      <button data-tool="note">Note</button>
    </div>

    <div class="noteSel" id="noteSel"></div>

<script>
/* =======================================================================
   Stand — sheet music library and markup
   ======================================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ---------- storage layer (IndexedDB) ---------- */
// IndexedDB stores Blobs natively: no size cap worth worrying about, no base64
// inflation, no splitting files across keys. A PDF goes in as the File object.
const IDB_NAME = 'stand', IDB_STORE = 'kv';
const mem = new Map();          // fallback only, if IndexedDB is unavailable
let idbPromise = null, idbBroken = false;

function idb(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((res, rej) => {
    let req;
    try{ req = indexedDB.open(IDB_NAME, 1); }
    catch(e){ return rej(e); }
    req.onupgradeneeded = () => {
      if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error || new Error('IndexedDB unavailable'));
    req.onblocked = () => rej(new Error('IndexedDB blocked by another tab'));
  }).catch(err => { idbBroken = true; throw err; });
  return idbPromise;
}

function idbRun(mode, fn){
  return idb().then(db => new Promise((res, rej) => {
    const t = db.transaction(IDB_STORE, mode);
    const req = fn(t.objectStore(IDB_STORE));
    // A failed request aborts the transaction; capture its error first so the
    // message names the real cause (usually the quota being full).
    let reqErr = null;
    if(req) req.onerror = () => { reqErr = req.error; };
    const fail = () => rej(t.error || reqErr || new Error('write aborted, storage may be full'));
    t.oncomplete = () => res(req ? req.result : undefined);
    t.onerror = fail;
    t.onabort = fail;
  }));
}

const DB = {
  async get(k){
    if(mem.has(k)) return mem.get(k);
    if(idbBroken) return null;
    try{
      const v = await idbRun('readonly', s => s.get(k));
      return v === undefined ? null : v;
    }catch(e){ return null; }
  },
  async set(k, v){
    if(idbBroken){ mem.set(k, v); return true; }
    await idbRun('readwrite', s => s.put(v, k));
    return true;
  },
  keep(k, v){ mem.set(k, v); },
  async del(k){
    mem.delete(k);
    if(idbBroken) return;
    try{ await idbRun('readwrite', s => s.delete(k)); }catch(e){}
  }
};

const K = {
  index:'library:index',
  pdf:id=>'pdf:'+id,
  thumb:id=>'thumb:'+id,
  ink:id=>'ink:'+id,
  presets:'settings:presets'
};

async function estimateUsage(){
  try{
    if(navigator.storage && navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      return { used:e.usage || 0, quota:e.quota || 0 };
    }
  }catch(e){}
  return null;
}

/* ---------- app state ---------- */
const S = { docs:[], sets:[], set:null, query:'', ready:false };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- small helpers ---------- */
let toastTimer;
function toast(msg, ms=2200){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('on'), ms);
}
function busy(on, text){ $('#busyText').textContent = text || 'Working'; $('#busy').classList.toggle('on', !!on); }
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =======================================================================
   Library data
   ======================================================================= */
async function loadLibrary(){
  const idx = await DB.get(K.index);
  if(idx){ S.docs = idx.docs || []; S.sets = idx.sets || []; }
  S.ready = true;
  await renderAll();
}
let idxTimer;
function saveIndexSoon(){ clearTimeout(idxTimer); idxTimer = setTimeout(saveIndexNow, 350); }
async function saveIndexNow(){
  try{ await DB.set(K.index, { docs:S.docs, sets:S.sets, v:1 }); }
  catch(e){ toast('Could not save the library. ' + e.message); }
}

function visibleDocs(){
  const q = S.query.trim().toLowerCase();
  return S.docs.filter(d => {
    if(S.set !== null && d.set !== S.set) return false;
    if(!q) return true;
    return [d.title,d.composer,d.keyInfo,d.notes].some(f => (f||'').toLowerCase().includes(q));
  });
}

/* =======================================================================
   Library rendering
   ======================================================================= */
const thumbCache = new Map();
async function thumbFor(id){
  if(thumbCache.has(id)) return thumbCache.get(id);
  const b = await DB.get(K.thumb(id));
  const url = b ? (typeof b === 'string' ? b : URL.createObjectURL(b)) : null;
  thumbCache.set(id, url);
  return url;
}
function dropThumb(id){
  const u = thumbCache.get(id);
  if(u && u.startsWith('blob:')) URL.revokeObjectURL(u);
  thumbCache.delete(id);
}
function canvasBlob(c, type, q){
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('could not encode image')), type, q));
}

async function renderAll(){ renderSets(); await renderGrid(); renderCount(); }

function renderCount(){
  const n = S.docs.length;
  $('#count').textContent = n === 0 ? '' : n + (n===1 ? ' piece' : ' pieces');
}

function renderSets(){
  const wrap = $('#sets');
  const all = `<button class="chip ${S.set===null?'on':''}" data-set="all">All pieces <span class="n">${S.docs.length}</span></button>`;
  const sets = S.sets.map(s => {
    const n = S.docs.filter(d => d.set === s.id).length;
    return `<button class="chip ${S.set===s.id?'on':''}" data-set="${s.id}">${esc(s.name)} <span class="n">${n}</span></button>`;
  }).join('');
  wrap.innerHTML = all + sets + `<button class="chip add" data-set="new">New set</button>`;
  wrap.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      const v = c.dataset.set;
      if(v === 'new') return openSetModal(null);
      if(v === 'all'){ S.set = null; }
      else if(S.set === v){ return openSetModal(v); }   // tap an active set again to rename
      else S.set = v;
      renderAll();
    });
  });
}

async function renderGrid(){
  const grid = $('#grid');
  const docs = visibleDocs();
  grid.innerHTML = '';
  $('#empty').style.display = (S.docs.length === 0) ? 'block' : 'none';
  if(S.docs.length && docs.length === 0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><h2>No match</h2><p>Nothing here fits that search.</p></div>`;
    return;
  }
  for(const d of docs){
    const el = document.createElement('div');
    el.className = 'tile' + (d.marked ? ' marked' : '');
    el.dataset.id = d.id;
    el.innerHTML = `
      <div class="sheet">
        <div class="nothumb">${esc(d.title || 'Untitled')}</div>
        <span class="marks"></span>
      </div>
      <button class="more" aria-label="Edit details for ${esc(d.title||'this piece')}"><i>···</i></button>
      <div class="meta">
        <div class="t">${esc(d.title || 'Untitled')}</div>
        <div class="c">${esc(d.composer || '')}${d.composer && d.pages ? ' · ' : ''}${d.pages ? d.pages + (d.pages===1?' page':' pages') : ''}</div>
      </div>`;
    grid.appendChild(el);
    thumbFor(d.id).then(src => {
      if(!src) return;
      const holder = el.querySelector('.sheet');
      if(!holder) return;
      const img = new Image();
      img.src = src; img.alt = ""; img.draggable = false;
      holder.replaceChild(img, holder.querySelector('.nothumb'));
    });
    el.querySelector('.more').addEventListener('click', ev => { ev.stopPropagation(); openDetails(d.id); });
    attachTileGestures(el, d.id);
  }
}

/* =======================================================================
   Tile gestures — tap to open, long press to rearrange
   ======================================================================= */
let drag = null;
const LONG_PRESS = 300;   // ms of stillness before a tile lifts
const MOVE_SLOP = 10;     // finger travel that means "scrolling", not "lifting"

function attachTileGestures(el, id){
  let startX=0, startY=0, timer=null, moved=false, kind='touch';
  const cancelPress = () => { clearTimeout(timer); timer = null; };

  el.addEventListener('pointerdown', e => {
    if(e.target.closest('.more')) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY; moved = false; kind = e.pointerType;
    cancelPress();
    timer = setTimeout(() => { timer = null; if(!moved && !drag) beginDrag(el, id, startX, startY, kind); }, LONG_PRESS);
  });
  el.addEventListener('pointermove', e => {
    if(drag) return;
    if(Math.abs(e.clientX-startX) > MOVE_SLOP || Math.abs(e.clientY-startY) > MOVE_SLOP){ moved = true; cancelPress(); }
  });
  el.addEventListener('pointerup', e => {
    cancelPress();
    if(drag || moved) return;
    if(e.target.closest('.more')) return;
    openDoc(id);
  });
  // The browser cancels the pointer the moment it claims the touch for scrolling,
  // which is exactly when a press should stop counting as a press.
  el.addEventListener('pointercancel', cancelPress);
  // A long press must not raise iOS's selection callout or Android's context menu.
  el.addEventListener('contextmenu', e => e.preventDefault());
}

function beginDrag(el, id, x, y, kind){
  if(navigator.vibrate) navigator.vibrate(8);
  const img = el.querySelector('.sheet img');
  const ghost = document.createElement('div');
  ghost.className = 'ghost';
  ghost.innerHTML = `<div class="sheet">${img ? `<img src="${img.src}" alt="" draggable="false">` : ''}</div>`;
  document.body.appendChild(ghost);
  el.classList.add('dragging');
  drag = { el, id, ghost, dropSet: undefined, touch: kind !== 'mouse', x, y, scrollDir: 0, raf: 0 };
  moveGhost(x, y);

  /* A touch is arbitrated on its FIRST move: if the browser decides it is a
     scroll it takes the gesture and cancels the pointer stream outright, which
     is what stopped this working at all — the drag ended one frame after it
     began. Claiming the touch here, with a NON-PASSIVE listener that blocks the
     default, is what keeps it ours. touch-action can't do this job: it is read
     when the finger lands, long before we know a press is going to be held. */
  if(drag.touch){
    document.addEventListener('touchmove', onTouchDragMove, {passive:false});
    document.addEventListener('touchend', onDragEnd);
    document.addEventListener('touchcancel', onDragEnd);
  }else{
    window.addEventListener('pointermove', onPointerDragMove, {passive:false});
    window.addEventListener('pointerup', onDragEnd);
    window.addEventListener('pointercancel', onDragEnd);
  }
  autoScrollTick();
}

function moveGhost(x,y){
  const g = drag.ghost, w = 126, h = w*4/3;
  g.style.left = (x - w/2) + 'px';
  g.style.top = (y - h/2) + 'px';
}
function onTouchDragMove(e){
  if(!drag) return;
  e.preventDefault();                       // hold the gesture: no scrolling underneath
  const t = e.touches[0];
  if(t) dragTo(t.clientX, t.clientY);
}
function onPointerDragMove(e){
  if(!drag) return;
  e.preventDefault();
  dragTo(e.clientX, e.clientY);
}

function dragTo(x, y){
  drag.x = x; drag.y = y;
  moveGhost(x, y);

  $$('.chip').forEach(c => c.classList.remove('drop'));
  const chip = chipAt(x, y);
  if(chip){
    chip.classList.add('drop');
    drag.dropSet = (chip.dataset.set === 'all') ? null : chip.dataset.set;
  }else{
    drag.dropSet = undefined;
    reposition(x, y);
  }

  const r = $('#libScroll').getBoundingClientRect();
  drag.scrollDir = y > r.bottom - 80 ? 1 : (y < r.top + 60 ? -1 : 0);
}

function chipAt(x, y){
  drag.ghost.style.display = 'none';
  const under = document.elementFromPoint(x, y);
  drag.ghost.style.display = '';
  const chip = under && under.closest && under.closest('.chip');
  return (chip && chip.dataset.set !== 'new') ? chip : null;
}

/* Where the held tile belongs now. Worked out from every other tile's position
   rather than from whatever happens to sit under the finger: a hit test moves
   the tile, which changes what is under the finger, which moves it back — the
   flicker that makes grid dragging feel broken even when it technically works. */
function reposition(x, y){
  const grid = $('#grid');
  const others = Array.from(grid.children).filter(n => n !== drag.el && n.classList.contains('tile'));
  let idx = 0;
  for(const t of others){
    const r = t.getBoundingClientRect();
    const cy = r.top + r.height/2, cx = r.left + r.width/2;
    // below this row → past it; above → not; alongside → whichever side of centre
    const past = y > cy + r.height/2 ? true : (y < cy - r.height/2 ? false : x > cx);
    if(past) idx++;
  }
  const ref = others[idx] || null;
  if(ref === drag.el.nextElementSibling) return;          // already in that slot
  if(!ref && drag.el === grid.lastElementChild) return;
  grid.insertBefore(drag.el, ref);
}

/* Held near an edge, the library keeps scrolling on its own — without this a
   reorder can only ever move a tile as far as one screen. */
function autoScrollTick(){
  if(!drag) return;
  if(drag.scrollDir){
    const sc = $('#libScroll'), before = sc.scrollTop;
    sc.scrollTop += drag.scrollDir * 10;
    if(sc.scrollTop !== before) reposition(drag.x, drag.y);
  }
  drag.raf = requestAnimationFrame(autoScrollTick);
}

function onDragEnd(){
  if(!drag) return;
  cancelAnimationFrame(drag.raf);
  document.removeEventListener('touchmove', onTouchDragMove);
  document.removeEventListener('touchend', onDragEnd);
  document.removeEventListener('touchcancel', onDragEnd);
  window.removeEventListener('pointermove', onPointerDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  window.removeEventListener('pointercancel', onDragEnd);
  drag.ghost.remove();
  drag.el.classList.remove('dragging');
  $$('.chip').forEach(c => c.classList.remove('drop'));

  const moved = S.docs.find(d => d.id === drag.id);
  if(drag.dropSet !== undefined && moved){
    moved.set = drag.dropSet;
    saveIndexSoon();
    const name = drag.dropSet === null ? 'All pieces' : (S.sets.find(s=>s.id===drag.dropSet)||{}).name;
    toast('Moved to ' + name);
    drag = null;
    renderAll();
    return;
  }
  // commit new visual order into the master list
  const order = Array.from($('#grid').children).map(n => n.dataset.id).filter(Boolean);
  const inView = new Set(order);
  const rest = S.docs.filter(d => !inView.has(d.id));
  const reordered = order.map(id => S.docs.find(d => d.id === id)).filter(Boolean);
  S.docs = mergeOrder(S.docs, reordered, rest);
  saveIndexSoon();
  drag = null;
}
function mergeOrder(all, reordered, rest){
  // keep non-visible docs in their relative slots, drop the visible ones into the new sequence
  const out = []; let ri = 0;
  const visibleIds = new Set(reordered.map(d=>d.id));
  for(const d of all){
    if(visibleIds.has(d.id)){ out.push(reordered[ri++]); }
    else out.push(d);
  }
  return out;
}

/* =======================================================================
   Importing PDFs
   ======================================================================= */
function showStartupError(msg){
  $('#startupErrorMsg').textContent = msg;
  $('#startupError').style.display = 'block';
}

const PDFJS_WORKER_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let usingRealWorker = false;

// Can this browser actually run a Worker from a blob? On a normal hosted page
// the answer is yes, and parsing moves off the main thread so page turns stay
// smooth. Inside some embedded webviews blob URLs are blocked, in which case we
// fall back to the main-thread handler that pdf.worker.min.js already registered
// by being loaded as a plain script.
function blobWorkersWork(){
  return new Promise(res => {
    let w, url;
    const done = ok => { clearTimeout(timer); try{ w && w.terminate(); }catch(e){} if(url) URL.revokeObjectURL(url); res(ok); };
    const timer = setTimeout(() => done(false), 2000);
    try{
      url = URL.createObjectURL(new Blob(['self.postMessage(1)'], {type:'text/javascript'}));
      w = new Worker(url);
      w.onmessage = () => done(true);
      w.onerror = () => done(false);
    }catch(e){ done(false); }
  });
}

async function setupPdfEngine(){
  if(await blobWorkersWork()){
    try{
      const code = await (await fetch(PDFJS_WORKER_URL)).text();
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        URL.createObjectURL(new Blob([code], {type:'text/javascript'}));
      usingRealWorker = true;
      return true;
    }catch(e){ console.warn('Falling back to main-thread parsing:', e); }
  }
  // pdf.worker.min.js was loaded as a script, so globalThis.pdfjsWorker exists and
  // pdf.js will parse on the main thread without trying to build a worker.
  pdfjsLib.GlobalWorkerOptions.workerSrc = '';
  usingRealWorker = false;
  return false;
}

// Parsing now happens on the main thread, so give the browser a frame to paint
// the loading overlay before we block it.
function yieldToPaint(){
  return new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
}

$('#picker').addEventListener('change', async e => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if(!files.length) return;
  for(let i=0;i<files.length;i++){
    busy(true, files.length > 1 ? `Adding ${i+1} of ${files.length}` : 'Adding ' + files[i].name);
    await yieldToPaint();
    try{ await importFile(files[i]); }
    catch(err){
      console.error(err);
      toast('Could not read ' + files[i].name + ': ' + (err && err.message ? err.message : 'unknown error'), 5000);
    }
  }
  busy(false);
  await renderAll();
});

// Scanner metadata is often misencoded and arrives as replacement characters or
// stray control codes. If a title looks like that, the filename is more useful.
function usableText(s){
  if(!s) return false;
  const t = String(s).trim();
  if(t.length < 2) return false;
  if(/[\uFFFD\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(t)) return false;
  const latin = (t.match(/[A-Za-z0-9]/g) || []).length;
  return latin >= Math.ceil(t.replace(/\s/g,'').length * 0.4);
}
/* =======================================================================
   Recognising a composer in a filename

   Imported scores are nearly always named after their composer — "Bach -
   Invention 4.pdf", "chopin_nocturne_op9_no2.pdf", "Debussy Clair de Lune" —
   so the composer field can usually fill itself in. Matching is on whole
   words, case and accents ignored, and the LONGEST matching name wins, which
   is how "C.P.E. Bach" beats the plain "Bach" sitting inside it.

   Two things shape the list below. First, where a surname is shared, the bare
   surname goes to whoever a musician means by default — "Bach" is Johann
   Sebastian, "Mozart" is Wolfgang — and the others need a first name or
   initials. Second, a composer whose surname is also an ordinary English word
   is listed ONLY under their full name: "Piano Part.pdf" must not come out as
   Arvo Pärt, and "The Barber of Seville" is Rossini, not Samuel Barber. That
   rule costs a few true matches and prevents a lot of wrong ones, which is the
   right trade when a wrong name is worse than a blank field.
   ======================================================================= */

/* Accents off, punctuation to spaces, everything lower case, so that "DVOŘÁK",
   "Dvorak" and "dvořák_op72" all reduce to the same thing. A few letters don't
   decompose on their own and are spelled out by hand. */
function normText(s){
  return String(s || '')
    .replace(/ß/g,'ss').replace(/[øØ]/g,'o').replace(/[æÆ]/g,'ae')
    .replace(/[œŒ]/g,'oe').replace(/[łŁ]/g,'l').replace(/[đĐ]/g,'d')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}

// Flattened once at load: every spelling, longest first, so the most specific
// name always gets the first look.
const COMPOSER_KEYS = (() => {
  const out = [];
  for(const [name, keys] of COMPOSERS)
    for(const raw of keys.split('|')){
      const key = normText(raw);
      if(key) out.push({ key, name });
    }
  out.sort((a,b) => b.key.length - a.key.length);
  return out;
})();

/* The composer named in a piece of text, or '' if none is. Matching is on whole
   words — padding both sides with a space is what stops "Bach" being found
   inside "Bachelor" while still finding it in "bach-invention-4". */
function matchComposer(text){
  // A filename may run words together — "ChopinNocturne" — so the camel-split
  // reading is tried as well. The plain reading goes first, since splitting it
  // would break names that legitimately carry a capital in the middle, like
  // MacMillan and MacDowell.
  const hays = [' ' + normText(text) + ' '];
  const split = ' ' + normText(camelSplit(text)) + ' ';
  if(split !== hays[0]) hays.push(split);
  for(const hay of hays){
    if(hay.length < 4) continue;
    for(const c of COMPOSER_KEYS)
      if(hay.includes(' ' + c.key + ' ')) return c.name;
  }
  return '';
}

/* "PianoSonata2" carries three words with no separator between them, which is
   ordinary in a downloaded filename. Splitting on the lower-to-upper boundary
   has to happen before anything is lowercased, or the boundary is gone. */
function camelSplit(s){
  return String(s || '')
    .replace(/WoO/g, 'WOO')                        // Beethoven's catalogue, not two words
    .replace(/([a-zà-ÿ])([A-ZÀ-Þ])/g, '$1 $2');
}

/* Same normalisation as composer matching, plus the camel split and a break
   between letters and digits, so "Sonata2", "Op.19" and "K545" all come apart
   into countable words. */
function normWork(s){
  return normText(camelSplit(s))
    .replace(/([a-z])(\d)/g, '$1 $2')
    .replace(/(\d)([a-z])/g, '$1 $2')
    .replace(/\s+/g, ' ').trim();
}

/* Words that carry no identity — dropped before matching a genre and a number,
   so "sonata no 14" and "sonata 14" come out the same. */
const WORK_FILLER = new Set(['no','nr','n','num','number','op','opus','the','in','of','for','and',
  'a','an','sheet','music','score','scores','complete','full','free','download','pdf','piano solo',
  'imslp','pmlp','edition','urtext','arr','arrangement','transcription','part','parts']);

function leanWords(s){
  return s.split(' ').filter(w => w && !WORK_FILLER.has(w)).join(' ');
}

/* One index per composer, built once at load.

   byKey    catalogue numbers, the strongest signal there is
   phrases  nicknames and distinctive titles, longest first so "sonata fantasy"
            is tried before "sonata"
   genres   a genre and a number derived from the canonical titles themselves
            ("Piano Sonata No. 14" → "piano sonata 14" and "sonata 14"), which
            is how "Beethoven Sonata 14.pdf" finds its way home

   A short genre key claimed by two different works is ambiguous and thrown
   away, unless exactly one of them is the piano work — in a sheet music app on
   a piano stand, an unqualified "Sonata No. 1" means the piano one. */
const WORK_INDEX = (() => {
  const out = {};
  for(const composer in WORKS){
    const byKey = Object.create(null), phrases = [], genreHits = new Map();
    for(const [key, title, alts] of WORKS[composer]){
      const entry = { key, title };
      byKey[normWork(key)] = entry;
      if(alts) for(const p of alts.split('|')){
        const k = normWork(p);
        if(k) phrases.push({ key: k, entry });
      }
      const note = (k, e) => {
        if(!k) return;
        if(!genreHits.has(k)) genreHits.set(k, []);
        genreHits.get(k).push(e);
      };
      // "Piano Sonata No. 14 in ..." → "piano sonata 14", and "sonata 14"
      const lead = /^([A-Za-zÀ-ÿ’' -]+?)\s+No\.\s*(\d+)/.exec(title);
      if(lead){
        const words = normWork(lead[1]).split(' ').filter(Boolean);
        if(words.length){
          note(words.join(' ') + ' ' + lead[2], entry);
          if(words.length > 1) note(words[words.length-1] + ' ' + lead[2], entry);
        }
      }
      // "Clair de lune (Suite bergamasque No. 3)" → "suite bergamasque 3"
      const inner = /\(([^)]+?)\s+No\.\s*(\d+)\)\s*$/.exec(title);
      if(inner) note(normWork(inner[1]) + ' ' + inner[2], entry);
    }
    const genres = [];
    for(const [k, hits] of genreHits){
      let pick = hits[0];
      if(hits.length > 1){
        const pianos = hits.filter(h => /^Piano /.test(h.title));
        if(pianos.length === 1) pick = pianos[0];
        else continue;                       // genuinely ambiguous: don't guess
      }
      genres.push({ key: k, entry: pick });
    }
    phrases.sort((a,b) => b.key.length - a.key.length);
    genres.sort((a,b) => b.key.length - a.key.length);
    out[composer] = { byKey, phrases, genres };
  }
  return out;
})();

/* Catalogue numbers written in a filename, most specific first. An opus and the
   number that follows it are read together, so "Op. 9 No. 2" stays one idea
   rather than two loose numbers that might not belong to each other. */
function catalogueKeys(hay){
  const keys = [];
  const op = /\bop(?:us)?\s+(\d+)\s*([ab])?(?:\s+(?:no|nr|n|number)\s+(\d+))?/.exec(hay);
  if(op){
    // "81a" is stored as "81 a", since letters and digits are split apart
    // everywhere else too; build the lookup the same way or it never matches.
    const base = op[1] + (op[2] ? ' ' + op[2] : '');
    if(op[3]) keys.push(base + ' ' + op[3]);
    else {
      const loose = /\b(?:no|nr)\s+(\d+)/.exec(hay);
      if(loose) keys.push(base + ' ' + loose[1]);
    }
    keys.push(base);
    if(op[2]) keys.push(op[1]);          // "Op. 81" for a work catalogued as 81a
  }
  const k = /\bkv?\s+(\d+)/.exec(hay);
  if(k) keys.push('k ' + k[1]);
  const woo = /\bwoo\s+(\d+)/.exec(hay);
  if(woo) keys.push('woo ' + woo[1]);
  return keys;
}

// "2nd movement", "mvt. 3", "Movement II" — appended to whatever was identified.
const ROMAN = { i:1, ii:2, iii:3, iv:4, v:5, vi:6, vii:7, viii:8 };
const ORDINAL = { first:1, second:2, third:3, fourth:4, fifth:5, sixth:6, seventh:7, eighth:8 };
function movementNumber(hay){
  let m = /\b(?:mov(?:emen)?t?|mvt|mvmt|satz)\s+(\d+)\b/.exec(hay);
  if(m) return +m[1];
  m = /\b(\d+)\s+(?:st|nd|rd|th)\s+(?:mov(?:emen)?t?|mvt)\b/.exec(hay);
  if(m) return +m[1];
  m = /\b(?:mov(?:emen)?t?|mvt|satz)\s+([ivx]+)\b/.exec(hay);
  if(m && ROMAN[m[1]]) return ROMAN[m[1]];
  m = /\b(first|second|third|fourth|fifth|sixth|seventh|eighth)\s+(?:mov(?:emen)?t?|mvt)\b/.exec(hay);
  if(m) return ORDINAL[m[1]];
  return 0;
}

/* When nothing in the file names a composer, the piece can still name itself.
   "Andante Favori, WoO 57" says Beethoven as plainly as the word would, because
   WoO 57 is his and nobody else's — the cover page said BEETHOVEN, but a cover
   page is a picture and the metadata carried the editor's name instead.

   So every catalogue is asked, and the answer is only used if exactly one
   composer can claim it. "Op. 27 No. 2" is a Beethoven sonata AND a Chopin
   nocturne, so it identifies nothing on its own and is left alone. */
function identifyWork(text){
  if(!text) return null;
  const hits = [];
  for(const composer in WORKS){
    const r = findWork(composer, text);
    if(r) hits.push({ composer, title: r.title, tier: r.tier });
  }
  // A genre and a number only means something once you know whose it is —
  // "Symphony No. 5" belongs to half the composers who ever lived, and the one
  // catalogued here isn't evidence. Naming a composer this way needs a
  // catalogue number or a distinctive title.
  const strong = hits.filter(h => h.tier <= 2);
  if(!strong.length) return null;
  // Then weigh what's left: "K. 311" is a Mozart catalogue number and settles
  // the matter. Only claims of equal strength compete.
  const best = Math.min(...strong.map(h => h.tier));
  const top = strong.filter(h => h.tier === best);
  return top.length === 1 ? top[0] : null;
}

/* The piece a filename is describing, or '' if it can't be told. Three passes,
   strongest evidence first: a catalogue number, then a nickname, then a genre
   and a number. Nothing convincing means no rename — the imported title stays. */
function guessWorkTitle(composer, text){
  const r = findWork(composer, text);
  return r ? r.title : '';
}

/* The work, and how strongly it was identified: 1 a catalogue number, 2 a
   nickname, 3 a genre and a number. The strength matters when two composers
   both think a filename is theirs. */
function findWork(composer, text){
  const idx = WORK_INDEX[composer];
  if(!idx || !text) return null;
  const hay = ' ' + normWork(text) + ' ';
  const lean = ' ' + leanWords(normWork(text)) + ' ';

  let found = null, tier = 0;
  for(const key of catalogueKeys(hay))
    if(idx.byKey[key]){ found = idx.byKey[key]; tier = 1; break; }

  /* A filename can name both a set and a piece inside it —
     "suite_bergamasque_3_clair_de_lune" names two things, and the piece is the
     one you want. So every phrase that matches is collected and the most
     specific wins: a movement within a set (its key carries a "/") beats the
     set itself, and a longer name beats a shorter one. */
  if(!found){
    let best = null;
    for(const p of idx.phrases){
      if(!hay.includes(' ' + p.key + ' ')) continue;
      const rank = [p.entry.key.includes('/') ? 1 : 0, p.key.length];
      if(!best || rank[0] > best.rank[0] || (rank[0] === best.rank[0] && rank[1] > best.rank[1]))
        best = { entry: p.entry, rank };
    }
    if(best){ found = best.entry; tier = 2; }
  }
  if(!found)
    for(const g of idx.genres) if(lean.includes(' ' + g.key + ' ')){ found = g.entry; tier = 3; break; }
  if(!found) return null;

  const mv = movementNumber(hay);
  return { title: mv ? found.title + ' — Movement ' + mv : found.title, tier };
}

function cleanName(n){
  return n.replace(/\.pdf$/i,'').replace(/[_]+/g,' ').replace(/\s{2,}/g,' ').trim();
}

async function importFile(file){
  const id = uid();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;

  // page one thumbnail
  const page = await pdf.getPage(1);
  const vp0 = page.getViewport({scale:1});
  const scale = 340 / vp0.width;
  const vp = page.getViewport({scale});
  const c = document.createElement('canvas');
  c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const cx = c.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:cx, viewport:vp}).promise;
  const thumb = await canvasBlob(c, 'image/jpeg', 0.72);

  // title from PDF metadata when it is there, otherwise the filename
  let title = cleanName(file.name), author = '';
  try{
    const md = await pdf.getMetadata();
    if(md && md.info){
      if(usableText(md.info.Title)) title = md.info.Title.trim();
      if(usableText(md.info.Author)) author = md.info.Author.trim();
    }
  }catch(e){}

  /* Composer: a name we recognise in the PDF's own author field first, since
     that field is meant to hold exactly this; then one recognised in the title
     or the filename, which is where it usually actually is. A recognised name
     is returned in its canonical spelling, so "BACH, J.S." and "js_bach" both
     land as Johann Sebastian Bach. */
  let composer = matchComposer(author) || matchComposer(title) ||
                 matchComposer(cleanName(file.name));

  /* If the piece itself can be identified, the catalogue's name for it replaces
     whatever the file was called — which also takes the composer's name out of
     the title, since catalogue titles never carry it. The filename is asked
     first: that is where "Op. 19" and "No. 2" usually survive, while a metadata
     title is often the publisher's blurb. Nothing identified means no rename. */
  let guess = composer ? (guessWorkTitle(composer, cleanName(file.name)) ||
                          guessWorkTitle(composer, title)) : '';

  /* Still no composer? The work may name itself. A catalogue number only one
     composer uses identifies them as surely as their name would, and this is
     the common case for a scan whose metadata carries the EDITOR rather than
     the composer. */
  if(!composer){
    const found = identifyWork(cleanName(file.name)) || identifyWork(title);
    if(found){ composer = found.composer; guess = found.title; }
  }
  // A real name we simply don't have on the list is better than nothing.
  if(!composer) composer = author;
  if(guess) title = guess;

  const doc = { id, title, composer, keyInfo:'', notes:'', set:S.set, pages:pdf.numPages,
                added:Date.now(), bytes:buf.byteLength, marked:false };

  try{
    await DB.set(K.pdf(id), file);
    await DB.set(K.thumb(id), thumb);
  }catch(err){
    console.error(err);
    doc.sessionOnly = true;
    DB.keep(K.pdf(id), file);
    DB.keep(K.thumb(id), thumb);
    toast(`${title} is open but couldn't be saved: ${err.message}`, 5000);
  }
  thumbCache.set(id, URL.createObjectURL(thumb));
  S.docs.unshift(doc);
  await saveIndexNow();
}

/* =======================================================================
   Viewer

   Performance model, mirroring how PDFKit + PencilKit stay fast:

   1. Bounded raster work. The ink layers are sized to the SCREEN, never to the
      page, and draw in screen space. At 6x zoom the old code allocated and
      cleared an ~11 megapixel buffer on every stroke; now it is always about
      one screen's worth no matter the zoom. The PDF bitmap is likewise capped.
   2. No layout in the input path. Pointer handling used to call
      getBoundingClientRect() per point, forcing a synchronous layout dozens of
      times per frame. All geometry is cached in plain numbers and only
      recomputed when it actually changes.
   3. Additive drawing. Committed marks accumulate on the ink canvas and are
      never wholesale repainted per stroke. A full repaint happens only on page
      change, zoom, pan-end, erase and undo, and it culls strokes whose bounding
      box is off screen. Cost per pen event is O(1) in the number of existing
      marks.
   4. Pan and zoom are GPU transforms (translate3d) on composited layers rather
      than re-rasterizations, so dragging never re-renders.
   5. Page turns are bitmap swaps. Neighbours are pre-rasterized, so a turn is a
      synchronous drawImage with no await anywhere in the path. Taps therefore
      queue properly: three fast taps advance three pages.
   ======================================================================= */
const V = {
  id:null, doc:null, pdf:null, page:1,
  zoom:1, fit:0, renderW:0, renderH:0,
  markup:false, erasing:false,
  tool:'pen', note:'quarter', stem:1, savedColor:null,
  hue:352, sat:67, tone:45, size:2.5,
  presets:null, selectedPreset:1,
  ink:{}, undo:[], dirty:false, saving:false,
  cache:new Map(), rendering:false, want:null, exiting:false, exitSeq:0

const MAX_ZOOM = 6;
/* Tap tolerances. Real fingers roll a little and linger a little, so these are
   deliberately generous: a page turn that silently does nothing is far worse
   than one that fires from a slightly sloppy touch. TAP_SLOP also matches the
   swipe arming distance, which closes a dead zone where a movement was too big
   to count as a tap but too small to arm a swipe, and so did nothing at all. */
const TAP_SLOP = 18, TAP_MS = 2000, SWIPE_ARM = 18, PINCH_ENGAGE = 12;
const nowMs = () => (window.performance && performance.now) ? performance.now() : Date.now();
const EDIT_SWIPE = 60;    // an upward flick this far opens markup

/* Zoomed in, a vertical drag could mean either "move the page" or "flick to open
   markup", so the two are told apart by SPEED, decided ONCE at the moment the
   finger leaves the slop: a quick upward flick is a gesture and the page stays
   put, a slow drag pans and can no longer be mistaken for a gesture however it
   ends. Judging at release instead — as this used to — meant a pan always moved
   the page first and could still be stolen by the way you happened to lift your
   finger. */
const PAN_ARM = 12;        // travel before a zoomed drag is judged pan-or-flick
const FLICK_V = 0.42;      // px per ms: at or above this the drag is a flick
const FLICK_WINDOW = 60;   // ms of motion the speed is measured over

/* Speed of the recent vertical motion, positive downward. Measured over a time
   window rather than between the last two events, which can be microseconds
   apart and would make a slow drag look like a flick. A long still pause before
   the motion is excluded, so resting a finger and then flicking still reads as
   a flick rather than being averaged away to nothing. */
function flickSpeed(hist){
  if(!hist || hist.length < 2) return 0;
  const last = hist[hist.length-1];
  let first = hist[0];
  for(let i = hist.length-1; i >= 0; i--){
    if(last.t - hist[i].t >= FLICK_WINDOW){
      first = (last.t - hist[i].t > FLICK_WINDOW*2.5 && i < hist.length-1) ? hist[i+1] : hist[i];
      break;
    }
  }
  const dt = last.t - first.t;
  if(dt <= 0) return 0;
  return (last.y - first.y)/dt;
}
const MAX_PAGE_PIXELS = 5.5e6;   // ceiling on the page bitmap, whatever the zoom

const stage=$('#stage'), pagewrap=$('#pagewrap'), ghostwrap=$('#ghostwrap'), inkLayer=$('#inkLayer');
const pdfCanvas=$('#pdfCanvas'), ghostCanvas=$('#ghostCanvas'),
      inkCanvas=$('#inkCanvas'), liveCanvas=$('#liveCanvas');
const pctx=pdfCanvas.getContext('2d',{alpha:false});
const gctx=ghostCanvas.getContext('2d',{alpha:false});
const ictx=inkCanvas.getContext('2d');
const lctx=liveCanvas.getContext('2d');

/* ---------- cached geometry: the whole point is that the input path reads
   these numbers instead of asking the DOM anything ---------- */
let panX=0, panY=0;              // page origin, in stage CSS px
let stageW=0, stageH=0, stageL=0, stageT=0;
let inkDpr=1;

function measure(){
  stageW = stage.clientWidth; stageH = stage.clientHeight;
  syncStageOrigin();
  sizeInkLayer();
}
/* The viewer slides in on a CSS transform, so a rect captured while that
   animation is mid-flight reports the stage far below where it ends up, and every
   touch coordinate derived from it is wrong (marks land off-page, pinch focal
   points fly away). Reading it per point would fix that but costs a forced layout
   on every sample. Reading it once at the START OF EACH GESTURE is both correct
   and free: one layout read per touch, none in the hot path. */
function syncStageOrigin(){
  const r = stage.getBoundingClientRect();
  stageL = r.left; stageT = r.top;
}
function sizeInkLayer(){
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(stageW*d), h = Math.round(stageH*d);
  if(inkCanvas.width !== w || inkCanvas.height !== h){
    for(const c of [inkCanvas, liveCanvas]){
      c.width = w; c.height = h;
      c.style.width = stageW+'px'; c.style.height = stageH+'px';
    }
  }
  inkDpr = d;
}
function pageDpr(w,h){
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const px = w*h*d*d;
  return px > MAX_PAGE_PIXELS ? d * Math.sqrt(MAX_PAGE_PIXELS/px) : d;
}
function place(){
  pagewrap.style.transformOrigin = '0 0';
  pagewrap.style.transform = `translate3d(${panX}px,${panY}px,0)`;
}
/* One helper drives every live view change — pinch, rubber-band pan and the
   settle animation all just set (scale, translate) with origin 0 0. */
function setViewTransform(s, tx, ty){
  pagewrap.style.transformOrigin = '0 0';
  pagewrap.style.transform = `translate3d(${tx}px,${ty}px,0) scale(${s})`;
  inkLayer.style.transformOrigin = '0 0';
  inkLayer.style.transform = `translate3d(${tx - s*inkAtX}px,${ty - s*inkAtY}px,0) scale(${s})`;
}
function viewBounds(w, hgt){
  const exW = (w==null?V.renderW:w) - stageW, exH = (hgt==null?V.renderH:hgt) - stageH;
  return {
    minX: exW<=0 ? Math.round(-exW/2) : -exW, maxX: exW<=0 ? Math.round(-exW/2) : 0,
    minY: exH<=0 ? Math.round(-exH/2) : -exH, maxY: exH<=0 ? Math.round(-exH/2) : 0
  };
}
/* Overshoot past the edges is allowed while a gesture is live, but resisted, so
   the page feels physical rather than nailed down. */
const RUBBER = 0.35;
function rubber(v, min, max){
  if(v > max) return max + (v-max)*RUBBER;
  if(v < min) return min + (v-min)*RUBBER;
  return v;
}
let viewAnim = null;
/* Cancelling an animation used to drop its completion callback on the floor,
   which left the viewer mid-exit: fully transparent but still on top of the
   library, swallowing every touch. Stopping now always lands on the end state
   and runs the callback, so the view can never be stranded half-way. */
function stopViewAnim(){
  if(!viewAnim) return;
  const a = viewAnim; viewAnim = null;
  cancelAnimationFrame(a.id);
  setViewTransform(a.toS, a.toX, a.toY);
  a.done();
}
function animateView(fromS, fromX, fromY, toS, toX, toY, done, ms){
  stopViewAnim();
  const t0 = (window.performance && performance.now) ? performance.now() : Date.now();
  const dur = ms || 300;
  const ease = t => 1 - Math.pow(1-t, 3);      // brisk out, no bounce past the edge
  function frame(){
    const now = (window.performance && performance.now) ? performance.now() : Date.now();
    const t = Math.min(1, (now-t0)/dur), e = ease(t);
    setViewTransform(fromS + (toS-fromS)*e, fromX + (toX-fromX)*e, fromY + (toY-fromY)*e);
    if(t < 1) viewAnim.id = requestAnimationFrame(frame);
    else { viewAnim = null; done(); }
  }
  viewAnim = { id: requestAnimationFrame(frame), toS, toX, toY, done };
}
function clampPan(){
  const exW = V.renderW - stageW, exH = V.renderH - stageH;
  panX = exW <= 0 ? Math.round(-exW/2) : Math.min(0, Math.max(-exW, panX));
  panY = exH <= 0 ? Math.round(-exH/2) : Math.min(0, Math.max(-exH, panY));
  place();
}
function centerPage(){
  panX = Math.round((stageW - V.renderW)/2);
  panY = Math.round((stageH - V.renderH)/2);
  clampPan();
}

function colorNow(){
  return `hsl(${V.hue} ${V.sat}% ${V.tone}%)`;
}
const SIZE_MIN = 1, SIZE_MAX = 14, SIZE_STEP = 0.1;   // 130 steps over 270deg
const HL_ALPHA = 0.32;   // highlighter translucency; passes layer and deepen
const HL_MULT  = 3.2;    // highlighter lays down a broad marker nib
const NOTE_MULT = 5;     // stamped note height relative to the size knob
const STEM_MIN = 0.3, STEM_MAX = 1.8, STEM_STEP = 0.02;

/* Musical note stamps, drawn as vector paths rather than glyph characters so
   they render identically everywhere and stay crisp at any zoom. cx,cy is the
   notehead centre; h is the overall glyph height. */
const NOTE_KINDS = [
  {k:'whole',          label:'Whole',          open:true,  stem:false, flags:0, dot:false},
  {k:'half',           label:'Half',           open:true,  stem:true,  flags:0, dot:false},
  {k:'quarter',        label:'Quarter',        open:false, stem:true,  flags:0, dot:false},
  {k:'eighth',         label:'Eighth',         open:false, stem:true,  flags:1, dot:false},
  {k:'sixteenth',      label:'16th',           open:false, stem:true,  flags:2, dot:false},
  {k:'dotted-half',    label:'Dotted half',    open:true,  stem:true,  flags:0, dot:true},
  {k:'dotted-quarter', label:'Dotted quarter', open:false, stem:true,  flags:0, dot:true},
  {k:'dotted-eighth',  label:'Dotted 8th',     open:false, stem:true,  flags:1, dot:true}
];
const NOTE_BY_KIND = Object.fromEntries(NOTE_KINDS.map(n=>[n.k,n]));

function drawNoteGlyph(ctx, kind, cx, cy, h, color, stemMul){
  const n = NOTE_BY_KIND[kind] || NOTE_BY_KIND.quarter;
  const sm = stemMul == null ? 1 : stemMul;
  const rx = h*0.175, ry = h*0.125;          // notehead radii
  const lw = Math.max(1, h*0.05);
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineCap='round'; ctx.lineJoin='round';

  // stem first, so the head sits over its joint
  if(n.stem){
    const sx = cx + rx*0.92, top = cy - h*0.66*sm;
    const stemLen = h*0.66*sm;
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(sx, cy - ry*0.35); ctx.lineTo(sx, top); ctx.stroke();
    // A proper engraved flag tapers to a point at BOTH ends — thin at the stem,
    // widest around a third of the way down, thin again at the tip — which is
    // what actually reads as an elegant flourish instead of a solid wedge. The
    // inner edge hugs close to the stem the whole way, so the flag stays a
    // blade rather than filling in as a blob. Reach and spacing are fractions
    // of the stem's own length, verified to clear the notehead at every stem
    // setting from 0.3x to 1.8x, for one flag or two.
    const fw = stemLen;
    const spacing = n.flags>1 ? 0.40 : 0, reach = n.flags>1 ? 0.54 : 0.64;
    for(let i=0;i<n.flags;i++){
      const fy = top + i*fw*spacing;
      ctx.beginPath();
      // Start at the stem's LEFT edge and close back onto its RIGHT edge lower
      // down: the closing line crosses the stem, so the junction fills solid
      // instead of pinching to a point and leaving a notch at the top.
      ctx.moveTo(sx - lw*0.5, fy - lw*0.15);
      ctx.bezierCurveTo(sx+fw*0.29, fy+fw*0.11,  sx+fw*0.31, fy+fw*reach*0.63,  sx+fw*0.07, fy+fw*reach);
      ctx.bezierCurveTo(sx+fw*0.15, fy+fw*reach*0.60,  sx+fw*0.10, fy+fw*reach*0.26,  sx + lw*0.5, fy+fw*0.15);
      ctx.closePath();
      ctx.fill();
    }
  }

  // notehead, tilted the way engraved notation sits
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, -0.35, 0, Math.PI*2);
  if(n.open){ ctx.lineWidth = lw*1.05; ctx.stroke(); }
  else ctx.fill();

  if(n.dot){
    ctx.beginPath();
    ctx.arc(cx + rx*1.85, cy, Math.max(1, h*0.052), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function ensurePresetsLoaded(){
  if(V.presets) return Promise.resolve();
  if(presetsLoading) return presetsLoading;
  return presetsLoading = (async () => {
    const stored = await DB.get(K.presets).catch(()=>null);
    V.presets = (stored && stored.length === 5) ? stored : DEFAULT_PRESETS.map(p=>({...p}));
    buildSwatches();
  })();
}
function buildSwatches(){
  if(!V.presets) return;
  $('#swatches').innerHTML = V.presets.map((p,i) => {
    const c = `hsl(${p.h} ${p.s}% ${p.l}%)`;
    return `<button data-i="${i}" style="background:${c}" aria-label="${p.name||'Preset '+(i+1)}"></button>`;
  }).join('');
  syncInkPanel();
}
$('#swatches').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const i = +b.dataset.i, p = V.presets[i];
  V.hue = p.h; V.sat = p.s; V.tone = p.l; V.selectedPreset = i;
  V.erasing = false; $('#tErase').classList.remove('on');

});
$('#presetSave').addEventListener('click', async () => {
  await ensurePresetsLoaded();
  V.presets[V.selectedPreset] = {name:V.presets[V.selectedPreset].name, h:V.hue, s:V.sat, l:V.tone};
  buildSwatches();
  try{ await DB.set(K.presets, V.presets); toast('Saved to preset'); }
  catch(err){ toast('Could not save the preset', 3000); }

/* ---------- knobs: one shared amp-dial behavior for hue, saturation,
   lightness and pen size. Each turns through 270deg between hard MIN/MAX
   stops with a dead zone across the bottom, same as a real knob — sliding a
   finger through that dead zone holds the current value instead of jumping
   to the far end. The filled arc always shows the live pen color, so all
   four read as one consistent family of controls. ---------- */
function makeKnob(elSel, trackSel, armSel, {min, max, step, get, set}){
  const el = $(elSel), arm = $(armSel), track = $(trackSel);
  let center = null, lastT = null;
  function valueFromPoint(x, y){
    let deg = Math.atan2(x - center.cx, -(y - center.cy)) * 180/Math.PI;
    if(deg > 135) deg = 135;
    if(deg < -135) deg = -135;
    const t = (deg + 135) / 270;
    if(lastT !== null && Math.abs(t - lastT) > 0.5) return null;
    lastT = t;
    const raw = min + t*(max-min);
    return Math.round(raw/step) * step;
  }
  function grab(e){
    const r = el.getBoundingClientRect();
    center = { cx:r.left+r.width/2, cy:r.top+r.height/2 };
    lastT = null;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    const v = valueFromPoint(e.clientX, e.clientY);
    if(v !== null){ set(+v.toFixed(4)); syncInkPanel(); }
  }
  el.addEventListener('pointerdown', grab);
  el.addEventListener('pointermove', e => {
    if(!center || e.buttons === 0) return;
    const v = valueFromPoint(e.clientX, e.clientY);
    if(v !== null){ set(+v.toFixed(4)); syncInkPanel(); }
  });
  el.addEventListener('pointerup', () => { center = null; lastT = null; });
  el.addEventListener('pointercancel', () => { center = null; lastT = null; });
  return function update(color){
    const t = (get() - min) / (max - min);
    arm.style.transform = `rotate(${-135 + t*270}deg)`;
    track.style.background =
      `conic-gradient(from 225deg, ${color} 0 ${(t*75).toFixed(2)}%, rgba(255,255,255,.13) ${(t*75).toFixed(2)}% 75%, rgba(0,0,0,0) 75%)`;
  };
}
const updateHue   = makeKnob('#knobHue',   '#knobHueTrack',   '#knobHueArm',   {min:0,        max:360,      step:0.5,     get:()=>V.hue,  set:v=>{V.hue=v;}});
const updateSat   = makeKnob('#knobSat',   '#knobSatTrack',   '#knobSatArm',   {min:0,        max:100,      step:0.1,     get:()=>V.sat,  set:v=>{V.sat=v;}});
const updateLight = makeKnob('#knobLight', '#knobLightTrack', '#knobLightArm', {min:0,        max:100,      step:0.1,     get:()=>V.tone, set:v=>{V.tone=v;}});
const updateSize  = makeKnob('#knobSize',  '#knobSizeTrack',  '#knobSizeArm',  {min:SIZE_MIN, max:SIZE_MAX, step:SIZE_STEP, get:()=>V.size, set:v=>{V.size=v;}});
const updateStem  = makeKnob('#knobStem',  '#knobStemTrack',  '#knobStemArm',  {min:STEM_MIN, max:STEM_MAX, step:STEM_STEP, get:()=>V.stem, set:v=>{V.stem=v;}});

// Knob arcs are a fixed accent, independent of the pen colour — including in
// note mode, where the pen colour is black and would otherwise be invisible
// against the dark knob face.
const KNOB_ACCENT = 'rgb(111,195,96)';

function syncInkPanel(){
  const c = colorNow();
  const dot = $('#colorDot');
  if(dot){ dot.style.background = c; dot.style.borderColor = 'rgba(255,255,255,.55)'; }

  updateHue(KNOB_ACCENT); updateSat(KNOB_ACCENT); updateLight(KNOB_ACCENT); updateSize(KNOB_ACCENT); updateStem(KNOB_ACCENT);

  drawPreview(c);
  $$('#noteSel button').forEach(b => b.classList.toggle('on', b.dataset.k === V.note));
  if(V.presets) $$('#swatches button').forEach((b,i) => b.classList.toggle('on', i === V.selectedPreset));
}

/* ---------- preview: the actual nib, at the width it will really draw at the
   current zoom (on-screen CSS px == size * zoom), in the live colour ---------- */
/* The preview grows when the real nib or glyph would not fit inside it, so what
   you see is always the true size rather than a silently clipped one. Widths are
   cached rather than measured per frame: turning a knob must not force layout. */
let paletteInnerW = 0, previewDpr = 1;
function refreshPreviewSize(){
  const pal = $('#palette');
  const w = pal.clientWidth || 0;
  if(w) paletteInnerW = Math.max(120, w - 36);   // 18px padding each side
}
const PREVIEW_MIN_H = 52, PREVIEW_MAX_H = 168, NOTE_BOX_W = 100, NOTE_BOX_MAX_H = 340;

function previewDims(){
  if(V.tool === 'note'){
    const gh = V.size*NOTE_MULT*V.zoom;
    const needed = gh*(0.66*V.stem + 0.3) + 34;   // head plus whatever stem reaches up
    return { w: NOTE_BOX_W, h: Math.max(180, Math.min(NOTE_BOX_MAX_H, needed)) };
  }
  const nib = V.size*(V.tool==='highlight'?HL_MULT:1)*V.zoom;
  return { w: paletteInnerW || 320, h: Math.max(PREVIEW_MIN_H, Math.min(PREVIEW_MAX_H, nib + 22)) };
}
function syncPreviewCanvas(){
  const cv = $('#penPreview'), box = $('#previewBox');
  const {w, h} = previewDims();
  const d = Math.min(window.devicePixelRatio || 1, 2);
  previewDpr = d;
  box.style.height = h + 'px';
  box.style.width = V.tool === 'note' ? w + 'px' : '';
  box.style.flex = V.tool === 'note' ? '0 0 auto' : '';
  cv.style.height = h + 'px';
  const bw = Math.round(w*d), bh = Math.round(h*d);
  if(cv.width !== bw || cv.height !== bh){ cv.width = bw; cv.height = bh; }
  return {w, h, d};
}
function drawPreview(c){
  const cv = $('#penPreview');
  syncPreviewCanvas();
  if(!cv.width || !cv.getContext) return;
  const ctx = cv.getContext('2d'), d = previewDpr;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);

  if(V.tool === 'note'){
    // scale down only if even the grown box cannot hold the glyph
    let gh = V.size*NOTE_MULT*V.zoom*d;
    const reach = gh*(0.66*V.stem + 0.3) + 18*d;
    if(reach > cv.height) gh *= cv.height/reach;
    const up = gh*(0.66*V.stem + 0.13), down = gh*0.15;
    drawNoteGlyph(ctx, V.note, cv.width/2, (cv.height + up - down)/2, gh, c, V.stem);
    return;
  }
  const hl = V.tool === 'highlight';
  const midY = cv.height/2;
  const wpx = Math.max(1, Math.min(cv.height - 8*d, V.size*(hl?HL_MULT:1)*V.zoom*d));
  ctx.save();
  // The highlighter is translucent on paper, so the preview shows it translucent
  // over the same paper colour: what you see here is exactly one brush stroke.
  if(hl) ctx.globalAlpha = HL_ALPHA;
  ctx.strokeStyle = c; ctx.lineCap='round'; ctx.lineWidth = wpx;
  // Round caps stick out by half the line width past each endpoint, so insetting
  // by that much keeps the stroke's TOTAL length fixed and its tips on screen
  // however thick the nib gets.
  const pad = 10*d + wpx/2;
  ctx.beginPath();
  ctx.moveTo(pad, midY);
  ctx.lineTo(Math.max(pad + 1, cv.width - pad), midY);
  ctx.stroke();
  ctx.restore();
}

/* ---------- tool picker ---------- */
$('#toolSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const prev = V.tool;
  V.tool = b.dataset.tool;
  // Stamps are always black. Stash the drawing colour on the way in and put it
  // back on the way out, so switching to Note and back never costs you the
  // colour you had dialled in.
  if(V.tool === 'note' && prev !== 'note'){
    V.savedColor = {h:V.hue, s:V.sat, l:V.tone};
    V.hue = 0; V.sat = 0; V.tone = 0;
  }else if(prev === 'note' && V.tool !== 'note' && V.savedColor){
    V.hue = V.savedColor.h; V.sat = V.savedColor.s; V.tone = V.savedColor.l;
    V.savedColor = null;
  }
  V.erasing = false; $('#tErase').classList.remove('on');
  $$('#toolSeg button').forEach(x => x.classList.toggle('on', x.dataset.tool === V.tool));
  $('#palette').classList.toggle('noteMode', V.tool === 'note');
  refreshPreviewSize();
  syncInkPanel();
});

/* ---------- note stamp picker ---------- */
(function buildNoteSel(){
  const host = $('#noteSel');
  host.innerHTML = NOTE_KINDS.map(n =>
    `<button data-k="${n.k}" aria-label="${n.label}"><canvas width="60" height="84"></canvas></button>`).join('');
  const btns = $$('#noteSel button');
  NOTE_KINDS.forEach((n,i) => {
    const cv = btns[i] && btns[i].children && btns[i].children[0];
    if(cv && cv.getContext) drawNoteGlyph(cv.getContext('2d'), n.k, 26, 54, 46, '#E8EAED');
  });
